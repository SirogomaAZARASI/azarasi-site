<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPSロガー KML版</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f4f4f4;
    font-family:sans-serif;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin-top:0;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}

button{
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:15px;
    cursor:pointer;
}

.start{background:#4caf50;color:white;}
.pause{background:#ff9800;color:white;}
.resume{background:#2196f3;color:white;}
.stop{background:#f44336;color:white;}
.save{background:#673ab7;color:white;}
.clear{background:#555;color:white;}

.info{
    background:#f0f0f0;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.8;
}

#log{
    background:#111;
    color:#00ff66;
    padding:10px;
    border-radius:10px;
    height:250px;
    overflow:auto;
    font-size:12px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<div class="container">

<h1>GPSロガー</h1>

<div class="buttons">
<button class="start" id="startBtn">開始</button>
<button class="pause" id="pauseBtn">一時停止</button>
<button class="resume" id="resumeBtn">再開</button>
<button class="stop" id="stopBtn">停止</button>
<button class="save" id="saveBtn">KML保存</button>
<button class="clear" id="clearBtn">履歴削除</button>
</div>

<div class="info">
状態：<span id="state">待機中</span><br>
記録点数：<span id="count">0</span><br>
緯度：<span id="lat">-</span><br>
経度：<span id="lon">-</span><br>
高度：<span id="alt">-</span>
</div>

<div id="log"></div>

</div>

<script>

let watchId=null;
let paused=false;

let points=JSON.parse(
localStorage.getItem("gpslog") || "[]"
);

updateCount();

function saveStorage(){
    localStorage.setItem(
        "gpslog",
        JSON.stringify(points)
    );
}

function updateCount(){
    document.getElementById("count").textContent=
    points.length;
}

function updateState(text){
    document.getElementById("state").textContent=
    text;
}

function addLog(text){

    const log=
    document.getElementById("log");

    log.textContent+=text+"\n";

    log.scrollTop=
    log.scrollHeight;
}

function startLogging(){

    if(!navigator.geolocation){
        alert("位置情報に対応していません");
        return;
    }

    if(watchId!==null){
        return;
    }

    updateState("記録中");

    watchId=
    navigator.geolocation.watchPosition(

        position=>{

            if(paused) return;

            const point={

                lat:position.coords.latitude,
                lon:position.coords.longitude,
                alt:position.coords.altitude || 0,
                time:new Date().toISOString()

            };

            points.push(point);

            saveStorage();

            updateCount();

            document.getElementById("lat")
            .textContent=point.lat.toFixed(6);

            document.getElementById("lon")
            .textContent=point.lon.toFixed(6);

            document.getElementById("alt")
            .textContent=point.alt.toFixed(1);

            addLog(
                `[${point.time}]
Lat ${point.lat}
Lon ${point.lon}`
            );

        },

        error=>{
            addLog(
                "GPSエラー: "+
                error.message
            );
        },

        {
            enableHighAccuracy:true,
            maximumAge:0,
            timeout:10000
        }
    );
}

function pauseLogging(){
    paused=true;
    updateState("一時停止");
}

function resumeLogging(){
    paused=false;
    updateState("記録中");
}

function stopLogging(){

    if(watchId!==null){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId=null;
    }

    updateState("停止");
}

function generateKML(){

    if(points.length===0){
        return "";
    }

    const start=points[0];
    const end=points[points.length-1];

    let coordinates="";

    points.forEach(p=>{

        coordinates+=
        `${p.lon},${p.lat},${p.alt}\n`;

    });

    return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>

<name>GPS Log</name>

<Placemark>
<name>開始地点</name>
<Point>
<coordinates>
${start.lon},${start.lat},${start.alt}
</coordinates>
</Point>
</Placemark>

<Placemark>
<name>終了地点</name>
<Point>
<coordinates>
${end.lon},${end.lat},${end.alt}
</coordinates>
</Point>
</Placemark>

<Placemark>
<name>移動軌跡</name>
<LineString>
<tessellate>5</tessellate>
<coordinates>
${coordinates}
</coordinates>
</LineString>
</Placemark>

</Document>
</kml>`;
}

function saveKML(){

    if(points.length===0){

        alert("記録データがありません");

        return;
    }

    const blob=
    new Blob(
        [generateKML()],
        {
            type:
            "application/vnd.google-earth.kml+xml"
        }
    );

    const url=
    URL.createObjectURL(blob);

    const a=
    document.createElement("a");

    a.href=url;

    a.download=
    "gpslog_" +
    Date.now() +
    ".kml";

    a.click();

    URL.revokeObjectURL(url);
}

function clearLogs(){

    if(
        !confirm(
            "保存データを削除しますか？"
        )
    ){
        return;
    }

    points=[];

    localStorage.removeItem(
        "gpslog"
    );

    document.getElementById("log")
    .textContent="";

    updateCount();

    addLog("履歴削除");
}

document
.getElementById("startBtn")
.onclick=startLogging;

document
.getElementById("pauseBtn")
.onclick=pauseLogging;

document
.getElementById("resumeBtn")
.onclick=resumeLogging;

document
.getElementById("stopBtn")
.onclick=stopLogging;

document
.getElementById("saveBtn")
.onclick=saveKML;

document
.getElementById("clearBtn")
.onclick=clearLogs;

addLog(
`保存済みデータを復元
記録点数: ${points.length}`
);

</script>

</body>
</html>
