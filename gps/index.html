<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPSロガー</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
}

button{
    padding:14px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.start{background:#4caf50;color:white;}
.pause{background:#ff9800;color:white;}
.resume{background:#2196f3;color:white;}
.stop{background:#f44336;color:white;}
.save{background:#673ab7;color:white;}
.clear{background:#555;color:white;}

.info{
    background:#f0f0f0;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.8;
}

#log{
    max-height:300px;
    overflow:auto;
    background:#111;
    color:#0f0;
    padding:10px;
    border-radius:10px;
    font-size:12px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<div class="container">

<h1>GPSロガー</h1>

<div class="buttons">
<button class="start" id="startBtn">記録開始</button>
<button class="pause" id="pauseBtn">一時停止</button>
<button class="resume" id="resumeBtn">再開</button>
<button class="stop" id="stopBtn">停止</button>
<button class="save" id="saveBtn">XML保存</button>
<button class="clear" id="clearBtn">履歴削除</button>
</div>

<div class="info">
状態：<span id="state">待機中</span><br>
記録点数：<span id="count">0</span><br>
緯度：<span id="lat">-</span><br>
経度：<span id="lon">-</span><br>
高度：<span id="alt">-</span>
</div>

<div id="log"></div>

</div>

<script>
let watchId=null;
let paused=false;

let points=
JSON.parse(localStorage.getItem("gpslog")||"[]");

updateCount();

function saveStorage(){
    localStorage.setItem(
        "gpslog",
        JSON.stringify(points)
    );
}

function updateCount(){
    document.getElementById("count").textContent=
    points.length;
}

function addLog(text){

    const log=document.getElementById("log");

    log.textContent+=text+"\n";

    log.scrollTop=log.scrollHeight;
}

function updateState(text){
    document.getElementById("state").textContent=text;
}

function startLogging(){

    if(!navigator.geolocation){
        alert("GPS未対応");
        return;
    }

    if(watchId!==null){
        return;
    }

    updateState("記録中");

    watchId=
    navigator.geolocation.watchPosition(

        position=>{

            if(paused)return;

            const point={

                lat:position.coords.latitude,

                lon:position.coords.longitude,

                alt:position.coords.altitude||0,

                time:new Date().toISOString()
            };

            points.push(point);

            saveStorage();

            updateCount();

            document.getElementById("lat")
            .textContent=point.lat.toFixed(6);

            document.getElementById("lon")
            .textContent=point.lon.toFixed(6);

            document.getElementById("alt")
            .textContent=point.alt.toFixed(1);

            addLog(
                `[${point.time}]
Lat:${point.lat}
Lon:${point.lon}`
            );
        },

        error=>{
            addLog("GPSエラー:"+error.message);
        },

        {
            enableHighAccuracy:true,
            maximumAge:0,
            timeout:10000
        }

    );
}

function pauseLogging(){

    paused=true;

    updateState("一時停止");
}

function resumeLogging(){

    paused=false;

    updateState("記録中");
}

function stopLogging(){

    if(watchId!==null){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId=null;
    }

    updateState("停止");
}

function generateXML(){

    let xml=
`<?xml version="1.0" encoding="UTF-8"?>
<gpslog>
`;

    points.forEach(p=>{

        xml+=`
  <point>
    <lat>${p.lat}</lat>
    <lon>${p.lon}</lon>
    <alt>${p.alt}</alt>
    <time>${p.time}</time>
  </point>
`;

    });

    xml+=`
</gpslog>`;

    return xml;
}

function saveXML(){

    const blob=
    new Blob(
        [generateXML()],
        {
            type:"application/xml"
        }
    );

    const url=
    URL.createObjectURL(blob);

    const a=
    document.createElement("a");

    a.href=url;

    a.download=
    "gpslog_"+Date.now()+".xml";

    a.click();

    URL.revokeObjectURL(url);
}

function clearLogs(){

    if(!confirm("履歴を削除しますか？"))
    return;

    points=[];

    localStorage.removeItem("gpslog");

    updateCount();

    document.getElementById("log")
    .textContent="";

    addLog("履歴削除");
}

document.getElementById("startBtn")
.onclick=startLogging;

document.getElementById("pauseBtn")
.onclick=pauseLogging;

document.getElementById("resumeBtn")
.onclick=resumeLogging;

document.getElementById("stopBtn")
.onclick=stopLogging;

document.getElementById("saveBtn")
.onclick=saveXML;

document.getElementById("clearBtn")
.onclick=clearLogs;

addLog(
`保存済みログ ${points.length} 件を復元`
);
</script>

</body>
</html>
