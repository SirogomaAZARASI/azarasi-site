<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ブロック崩し 完全版</title>
  <style>
    body {
      background: #111;
      color: white;
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #modeSelect {
      margin-top: 60px;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    #scorePanel {
      font-size: 20px;
      margin: 10px;
    }
    canvas {
      background: #222;
      border: 2px solid #fff;
      touch-action: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="modeSelect">
    <h1>モードを選んでね！</h1>
    <button onclick="startGame(1)">🎯 通常モード（ボール1個）</button>
    <button onclick="startGame(2)">🔥 ダブルボールモード（ボール2個）</button>
  </div>
  <div id="scorePanel" style="display:none;">スコア: 0 | レベル: 1 | ライフ: 3</div>
  <canvas id="gameCanvas" width="480" height="320"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scorePanel = document.getElementById("scorePanel");
    const modeSelect = document.getElementById("modeSelect");

    let paddleX, rightPressed = false, leftPressed = false, touchX = null;
    const paddleHeight = 10, paddleWidth = 75;

    const brickRowCount = 3, brickColumnCount = 5;
    const brickWidth = 75, brickHeight = 20;
    const brickPadding = 10, brickOffsetTop = 30, brickOffsetLeft = 30;

    let score = 0, level = 1, lives = 3, balls = [], bricks = [], initialBallCount = 1;
    let gameLoop = null;

    function Ball(x, y, dx, dy) {
      this.x = x;
      this.y = y;
      this.dx = dx;
      this.dy = dy;
      this.radius = 8;
    }

    function getRandomBrickHP(level) {
      const rand = Math.random();
      if (level === 1) return 1;
      if (level === 2) return rand < 0.8 ? 1 : 2;
      if (level === 3) return rand < 0.6 ? 1 : (rand < 0.95 ? 2 : 3);
      if (level === 4) return rand < 0.5 ? 1 : (rand < 0.85 ? 2 : 3);
      if (level === 5) return rand < 0.4 ? 1 : (rand < 0.75 ? 2 : 3);
      if (level === 6) return rand < 0.3 ? 1 : (rand < 0.65 ? 2 : (rand < 0.95 ? 3 : 4));
      if (level === 7) return rand < 0.25 ? 1 : (rand < 0.55 ? 2 : (rand < 0.9 ? 3 : 4));
      if (level === 8) return rand < 0.2 ? 1 : (rand < 0.5 ? 2 : (rand < 0.85 ? 3 : 4));
      if (level === 9) return rand < 0.15 ? 1 : (rand < 0.45 ? 2 : (rand < 0.8 ? 3 : 4));
      return rand < 0.1 ? 1 : (rand < 0.35 ? 2 : (rand < 0.7 ? 3 : 4));
    }

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          let type = "normal";
          let hp;
          if (level >= 3 && Math.random() < 0.1) {
            type = "heal";
            hp = 10;
          } else {
            hp = getRandomBrickHP(level);
          }
          bricks[c][r] = {
            x: 0,
            y: 0,
            status: 1,
            type: type,
            hp: hp
          };
        }
      }
    }

    function resetGame() {
      score = 0;
      level = 1;
      lives = 3;
      balls = [];
      for (let i = 0; i < initialBallCount; i++) {
        balls.push(new Ball(canvas.width / 2 + i * 20, canvas.height - 30, 2 * (i % 2 ? -1 : 1), -2));
      }
      paddleX = (canvas.width - paddleWidth) / 2;
      initBricks();
    }

    function drawBricks() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
            const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
            b.x = brickX;
            b.y = brickY;

            let color;
            if (b.type === "heal") {
              color = "#00ff00";
            } else {
              let colors = ['#ff66cc', '#ff9900', '#ff3333', '#cc00ff'];
              color = colors[(b.hp - 1) % colors.length];
            }

            ctx.beginPath();
            ctx.rect(brickX, brickY, brickWidth, brickHeight);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.closePath();
          }
        }
      }
    }

    function drawPaddle() {
      ctx.beginPath();
      ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.closePath();
    }

    function drawBall(ball) {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#00ffff";
      ctx.fill();
      ctx.closePath();
    }

    function collisionDetection(ball) {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          let b = bricks[c][r];
          if (b.status === 1) {
            if (
              ball.x > b.x &&
              ball.x < b.x + brickWidth &&
              ball.y > b.y &&
              ball.y < b.y + brickHeight
            ) {
              ball.dy = -ball.dy;
              const hpBefore = b.hp;
              b.hp -= 1;
              if (b.hp <= 0) {
                b.status = 0;
                if (b.type === "heal") {
                  lives++;
                  alert("💚 ライフが1回復したよ！");
                } else {
                  score += 10 * hpBefore;
                }
              }
              checkLevelClear();
            }
          }
        }
      }
    }

    function checkLevelClear() {
      let allCleared = true;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            allCleared = false;
          }
        }
      }
      if (allCleared) {
        level++;
        initBricks();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawPaddle();

      balls.forEach(ball => {
        drawBall(ball);
        collisionDetection(ball);

        if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
          ball.dx = -ball.dx;
        }
        if (ball.y + ball.dy < ball.radius) {
          ball.dy = -ball.dy;
        } else if (ball.y + ball.dy > canvas.height - ball.radius) {
          if (ball.x > paddleX && ball.x < paddleX + paddleWidth) {
            ball.dy = -ball.dy;
          } else {
            balls = balls.filter(b => b !== ball);
            if (balls.length === 0) {
              lives--;
              if (lives > 0) {
                balls = [];
                for (let i = 0; i < initialBallCount; i++) {
                  balls.push(new Ball(canvas.width / 2 + i * 20, canvas.height - 30, 2 * (i % 2 ? -1 : 1), -2));
                }
                paddleX = (canvas.width - paddleWidth) / 2;
              } else {
                alert("ゲームオーバー！ レベル: " + level);
                cancelAnimationFrame(gameLoop);
                modeSelect.style.display = 'block';
                canvas.style.display = 'none';
                scorePanel.style.display = 'none';
                return;
              }
            }
          }
        }

        ball.x += ball.dx;
        ball.y += ball.dy;
      });

      if (rightPressed && paddleX < canvas.width - paddleWidth) {
        paddleX += 5;
      } else if (leftPressed && paddleX > 0) {
        paddleX -= 5;
      }

      if (touchX !== null) {
        paddleX = touchX - paddleWidth / 2;
        if (paddleX < 0) paddleX = 0;
        if (paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
      }

      scorePanel.textContent = `スコア: ${score} | レベル: ${level} | ライフ: ${lives}`;
      gameLoop = requestAnimationFrame(draw);
    }

    function startGame(ballCount) {
      initialBallCount = ballCount;
      modeSelect.style.display = 'none';
      canvas.style.display = 'block';
      scorePanel.style.display = 'block';
      cancelAnimationFrame(gameLoop);
      resetGame();
      draw();
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
      if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
    });
    document.addEventListener("keyup", e => {
      if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
      if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
    });
    canvas.addEventListener("touchstart", e => {
      touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
    });
    canvas.addEventListener("touchmove", e => {
      e.preventDefault();
      touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
    });
    canvas.addEventListener("touchend", () => {
      touchX = null;
    });
  </script>
</body>
</html>
