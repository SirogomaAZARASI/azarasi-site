<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
body{
  background:#0f1115;
  color:#fff;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  padding-bottom:80px;
}

/* 盤面 */
.grid{
  display:grid;
  gap:8px;
  width:min(92vw, 75vh);
  margin:10px auto;
}

.hole{
  background:#ccc;
  aspect-ratio:1;
  border-radius:10px;
  position:relative;
  overflow:hidden;
}

.mole{
  width:80%;
  height:80%;
  object-fit:contain;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.bad{
  width:60%;
  height:60%;
  background:red;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

@keyframes fall{
  0%{ transform:translate(-50%,-50%); opacity:1;}
  100%{ transform:translate(-50%,150%); opacity:0;}
}
.fall{ animation:fall 0.9s ease forwards; }

/* コンボ */
#comboPopup{
  position:fixed;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  font-size:60px;
  color:yellow;
  display:none;
  z-index:99999;
}

/* 結果 */
#resultScreen{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.result-number{
  font-size:52px;
}
.pop{ transform:scale(1.4); }

/* フルコンボ */
#fullCombo{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#000;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:64px;
  color:orange;
}

/* ★使い方モーダル（大きく） */
#ruleModal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:20000;
}

#ruleBox{
  background:#171a21;
  padding:25px;
  border-radius:12px;
  width:90%;
  max-width:500px;
}

#ruleBox h2{
  font-size:28px;
  margin-bottom:10px;
}

#ruleText{
  font-size:20px;
  line-height:1.6;
}

#ruleBox button{
  font-size:20px;
  padding:10px 20px;
  margin-top:15px;
}

/* ボタン */
button,select{
  font-size:18px;
  padding:10px 14px;
  border-radius:8px;
  margin:5px;
}

/* フッター */
.footer{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  background:linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.85));
  backdrop-filter:blur(10px);
  border-radius:12px;
  padding:10px;
  text-align:center;
  font-size:13px;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
  z-index:999;
}

.footer a{
  color:#66ccff;
  text-decoration:none;
  font-weight:600;
}

.footer a:hover{
  text-decoration:underline;
}

.footer .copyright{
  font-size:13px;
  font-weight:500;
  background:linear-gradient(90deg,#ffffff,#bbbbbb);
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  letter-spacing:0.3px;
  text-shadow:0 1px 2px rgba(0,0,0,0.6);
}

body{padding-bottom:80px;}

</style>
</head>

<body>

<h1>あざらし叩き</h1>

<select id="level">
<option value="1">レベル1</option>
<option value="2">レベル2</option>
</select>

<select id="size">
<option value="3">3×3</option>
<option value="4">4×4</option>
<option value="5">5×5</option>
</select>

<button onclick="startGame()">スタート</button>

<div id="score">スコア:0</div>
<div id="timer">時間:30</div>
<div id="combo">コンボ:0</div>

<div id="comboPopup"></div>
<div id="grid" class="grid"></div>

<div id="resultScreen">
  <h2>結果発表</h2>
  <div id="finalScore"></div>
  <div id="finalCombo"></div>
  <div id="finalNowCombo"></div>
  <button onclick="location.reload()">リスタート</button>
</div>

<div id="fullCombo">🔥 FULL COMBO!! 🔥</div>

<!-- ★使い方 -->
<div id="ruleModal">
  <div id="ruleBox">
    <h2>使い方</h2>
    <div id="ruleText"></div>
    <button onclick="closeRule()">スタート！</button>
  </div>
</div>

<div class="footer">
  <a href="../">← ゲーム一覧に戻る</a><br>
  <div class="copyright">
    Copyright © 2026 SirogomaAZARASI All Rights Reserved.
  </div>
</div>

<script>
const IMG={
  seal:{prefix:"",count:5},
  sun:{prefix:"sun",count:2},
  out:{prefix:"out",count:1}
};

function getImg(type){
  const t=IMG[type];
  return "images/"+t.prefix+(Math.floor(Math.random()*t.count)+1)+".png";
}

const grid=document.getElementById("grid");
const levelSelect=document.getElementById("level");
const sizeSelect=document.getElementById("size");
const timerEl=document.getElementById("timer");
const comboPopup=document.getElementById("comboPopup");
const resultScreen=document.getElementById("resultScreen");
const fullComboEl=document.getElementById("fullCombo");

const finalScore=document.getElementById("finalScore");
const finalCombo=document.getElementById("finalCombo");
const finalNowCombo=document.getElementById("finalNowCombo");

const ruleModal=document.getElementById("ruleModal");
const ruleText=document.getElementById("ruleText");

let holes=[],states=[],elements=[];
let score=0,combo=0,maxCombo=0,timeLeft=30,totalHits=0;
let moleInterval,timerInterval;

function createGrid(){
 grid.innerHTML="";
 const size=+sizeSelect.value;
 grid.style.gridTemplateColumns=`repeat(${size},1fr)`;

 holes=[];states=[];elements=[];
 for(let i=0;i<size*size;i++){
  let d=document.createElement("div");
  d.className="hole";
  d.onclick=()=>hit(i);
  grid.appendChild(d);
  holes.push(d);
  states.push(null);
  elements.push(null);
 }
}

/* ★使い方表示 */
function showRule(){
  if(levelSelect.value==1){
    ruleText.innerHTML="あざらしを叩こう！<br>赤丸はNG（-2）<br>逃すとコンボ切れ";
  }else{
    ruleText.innerHTML="サングラスだけ叩く！<br>普通はNG（-2）<br>逃すとコンボ切れ";
  }
  ruleModal.style.display="flex";
}

function closeRule(){
  ruleModal.style.display="none";
  startMain();
}

function startMain(){
 moleInterval=setInterval(spawn,1000);
 timerInterval=setInterval(()=>{
  timeLeft--;
  timerEl.textContent="時間:"+timeLeft;
  if(timeLeft<=0){
    clearInterval(moleInterval);
    clearInterval(timerInterval);
    showResult();
  }
 },1000);
}

/* 以下ゲーム処理そのまま */
function spawn(){
 const level=levelSelect.value;
 const empty=states.map((s,i)=>s===null?i:null).filter(i=>i!==null);
 if(!empty.length) return;

 const i=empty[Math.floor(Math.random()*empty.length)];
 let type="",el;

 if(level==1){
  if(Math.random()<0.7){
    type="seal";
    el=document.createElement("img");
    el.src=Math.random()<0.3?getImg("sun"):getImg("seal");
    el.className="mole";
  }else{
    type="bad";
    el=document.createElement("div");
    el.className="bad";
  }
 }

 if(level==2){
  if(Math.random()<0.5){
    type="glasses";
    el=document.createElement("img");
    el.src=getImg("sun");
    el.className="mole";
  }else{
    type="seal";
    el=document.createElement("img");
    el.src=getImg("seal");
    el.className="mole";
  }
 }

 holes[i].appendChild(el);
 states[i]=type;
 elements[i]=el;

 setTimeout(()=>{
  if(states[i]!==null){

    const level = levelSelect.value;

    let shouldBreak = false;

    // レベル1：あざらし（叩いてOK）を逃した時だけ切れる
    if(level == 1 && type === "seal"){
      shouldBreak = true;
    }

    // レベル2：サングラス（叩いてOK）を逃した時だけ切れる
    if(level == 2 && type === "glasses"){
      shouldBreak = true;
    }

    if(shouldBreak){
      combo = 0;
      updateCombo();
    }

    holes[i].innerHTML="";
    states[i]=null;
  }
},1500);
}

function updateCombo(){
 document.getElementById("combo").textContent="コンボ:"+combo;
}

function hit(i){
 if(states[i]===null) return;

 const type=states[i];
 const el=elements[i];
 const level=levelSelect.value;

 if(level==1){
  if(type==="bad"){score-=2;combo=0;}
  else{score++;combo++;}
 }

 if(level==2){
  if(type==="glasses"){score++;combo++;}
  else{score-=2;combo=0;}
 }

 document.getElementById("score").textContent="スコア:"+score;
 updateCombo();

 if(el.tagName==="IMG"){
  el.src=getImg("out");
  el.classList.add("fall");
  setTimeout(()=>holes[i].innerHTML="",900);
 }else{
  holes[i].innerHTML="";
 }

 states[i]=null;
}

function showResult(){
 resultScreen.style.display="flex";
 finalScore.innerHTML="スコア:"+score;
 finalCombo.innerHTML="最大コンボ:"+combo;
 finalNowCombo.innerHTML="";
}

function startGame(){
 clearInterval(moleInterval);
 clearInterval(timerInterval);

 score=0;combo=0;timeLeft=30;

 document.getElementById("score").textContent="スコア:0";
 updateCombo();
 timerEl.textContent="時間:30";

 createGrid();
 showRule();
}
</script>

</body>
</html>
