<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZATYPE | AZAgame</title>

<style>
:root{
    --cyan:#00e5ff;
    --green:#00ff88;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui;
}

body{
    overflow:hidden;
    background:radial-gradient(circle at top,#0f1c2c,#05070b);
    color:#d9f7ff;
}

/* scan */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom,transparent,rgba(0,229,255,.05),transparent);
    animation:scan 4s linear infinite;
    pointer-events:none;
}
@keyframes scan{
    0%{transform:translateY(-100%)}
    100%{transform:translateY(100%)}
}

/* HOME */
#homeScreen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#0f1c2c,#05070b);
    z-index:1000;
}

#homeTitle{
    font-size:64px;
    letter-spacing:6px;
    color:var(--cyan);
    text-shadow:0 0 20px var(--cyan);
}

#startFromHome{
    margin-top:30px;
    padding:18px 40px;
    font-size:20px;
    border:2px solid var(--cyan);
    background:rgba(0,0,0,.2);
    color:var(--cyan);
    cursor:pointer;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 10px rgba(0,229,255,.2)}
    50%{box-shadow:0 0 30px rgba(0,229,255,.8)}
    100%{box-shadow:0 0 10px rgba(0,229,255,.2)}
}

#homeHi{
    position:absolute;
    right:12px;
    bottom:12px;
    color:var(--green);
}

/* GAME */
#app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

#top{
    height:60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 16px;
    border-bottom:1px solid rgba(0,229,255,.2);
}

#stats{
    display:flex;
    gap:14px;
    font-size:13px;
}

#main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

#jp{font-size:42px;color:var(--cyan);}
#roma{font-size:20px;color:#7fdfff;max-width:80vw;}
#typed{font-size:24px;color:var(--green);min-height:40px;}

#bottom{
    height:90px;
    padding:10px;
}

#xpbar{
    height:8px;
    background:#111;
    width:100%;
}

#xpfill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--cyan),var(--green));
    transition:width .15s linear;
}

#timer{text-align:right;font-size:18px;}

/* RESULT */
#gameOver{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.9);
    z-index:2000;
}

#overPanel{
    width:320px;
    padding:25px 20px;
    border:1px solid rgba(0,229,255,.8);
    background:linear-gradient(180deg,rgba(10,20,30,.9),rgba(0,0,0,.95));
    box-shadow:0 0 20px rgba(0,229,255,.3);
    text-align:left;
}

#overPanel::before{
    content:"MISSION RESULT";
    position:absolute;
    top:-12px;
    left:10px;
    font-size:12px;
    color:var(--cyan);
}

#overScore{
    font-size:20px;
    color:var(--cyan);
    margin-bottom:10px;
}

.overLine{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}

.overLine span:last-child{
    color:var(--green);
}

#retryBtn{
    width:100%;
    margin-top:15px;
    padding:10px;
    border:1px solid var(--cyan);
    background:transparent;
    color:var(--cyan);
    cursor:pointer;
}

.glitch{
    animation:glitch .12s infinite;
}
@keyframes glitch{
    0%{transform:translate(0)}
    25%{transform:translate(1px,-1px)}
    50%{transform:translate(-1px,1px)}
    75%{transform:translate(1px,1px)}
    100%{transform:translate(0)}
}
</style>
</head>

<body>

<!-- HOME -->
<div id="homeScreen">
    <div id="homeTitle">AZATYPE</div>
    <button id="startFromHome">START</button>
    <div id="homeHi"></div>
</div>

<!-- GAME -->
<div id="app">

<div id="top">
    <div>AZATYPE</div>
    <div id="stats">
        <div>LV <span id="lv">1</span></div>
        <div>XP <span id="xpText">0</span></div>
        <div>Score <span id="score">0</span></div>
        <div>Combo <span id="combo">0</span></div>
        <div>HI <span id="hi">0</span></div>
    </div>
</div>

<div id="main">
    <div>
        <div id="jp">PRESS START</div>
        <div id="roma"></div>
        <div id="typed"></div>
    </div>
</div>

<div id="bottom">
    <div id="xpbar"><div id="xpfill"></div></div>
    <div id="timer">time 60</div>
</div>

</div>

<!-- RESULT -->
<div id="gameOver">
    <div id="overPanel">

        <div id="overScore">MAX COMBO 0</div>

        <div class="overLine">
            <span>LEVEL</span>
            <span id="overLv">1</span>
        </div>

        <div class="overLine">
            <span>COMBO</span>
            <span id="overCombo">0</span>
        </div>

        <div class="overLine">
            <span>HIGH SCORE</span>
            <span id="overHi">0</span>
        </div>

        <button id="retryBtn">RETRY</button>
    </div>
</div>



<script src="words.js"></script>

<script>

/* STATE */
let game={
running:false,
roma:"",
index:0,
combo:0,
maxCombo:0,
lv:1,
xp:0,
score:0,
time:60
};

let timerId=null;
let highScore=localStorage.getItem("highScore")||0;

/* DOM */
const homeScreen=document.getElementById("homeScreen");
const homeHi=document.getElementById("homeHi");

const jp=document.getElementById("jp");
const roma=document.getElementById("roma");
const typed=document.getElementById("typed");

const lv=document.getElementById("lv");
const xpText=document.getElementById("xpText");
const combo=document.getElementById("combo");
const hi=document.getElementById("hi");
const score=document.getElementById("score");

const xpfill=document.getElementById("xpfill");
const timer=document.getElementById("timer");

const gameOver=document.getElementById("gameOver");

/* HOME */
function showHome(){
homeScreen.style.display="flex";
homeHi.textContent="Hi score "+highScore;
}

document.getElementById("startFromHome").onclick=()=>{
homeScreen.style.display="none";
startGame();
};

/* GAME */
function startGame(){

game.running=true;
game.time=60;
game.combo=0;
game.maxCombo=0;
game.lv=1;
game.xp=0;
game.score=0;

nextWord();
updateUI();
startTimer();
}

/* WORD */
function nextWord(){
const w=WORDS[Math.floor(Math.random()*WORDS.length)];
game.roma=w[1];
game.index=0;

jp.textContent=w[0];
roma.textContent=w[1];
typed.textContent="";
}

/* INPUT */
document.addEventListener("keydown",e=>{

if(e.code==="Space"&&!game.running){
startGame();
return;
}

if(e.key==="Escape"){
location.reload();
}

if(!game.running) return;

const key=e.key.toLowerCase();
const target=game.roma[game.index];

if(!target) return;

if(key===target){

game.index++;
game.combo++;
game.xp+=5;
game.score += 10 + game.combo;

if(game.combo>game.maxCombo){
game.maxCombo=game.combo;
}

if(game.combo%20===0){
game.time+=5;
}

typed.textContent=game.roma.slice(0,game.index);

if(game.index>=game.roma.length){
game.xp+=20;
nextWord();
}

levelUp();
updateUI();

}else{

game.combo=0;
game.score -= 15;
if(game.score < 0) game.score = 0;

document.body.classList.add("glitch");
setTimeout(()=>document.body.classList.remove("glitch"),120);
}

});

/* LEVEL */
function levelUp(){
const need=game.lv*120;
if(game.xp>=need){
game.xp-=need;
game.lv++;
}
}

/* UI */
function updateUI(){

lv.textContent=game.lv;
xpText.textContent=game.xp;
combo.textContent=game.combo;
score.textContent=game.score;
hi.textContent=highScore;

/* XP BAR */
const need=game.lv*120;
const percent=(game.xp/need)*100;
xpfill.style.width=Math.min(percent,100)+"%";

timer.textContent="time "+game.time;
}

/* TIMER */
function startTimer(){
if(timerId) clearInterval(timerId);

timerId=setInterval(()=>{

if(!game.running) return;

game.time--;
updateUI();

if(game.time<=0){
endGame();
}

},1000);
}

/* END */
function endGame(){

game.running=false;

/* HI SCORE = SCORE */
if(game.score>highScore){
highScore=game.score;
localStorage.setItem("highScore",highScore);
}

gameOver.style.display="flex";

document.getElementById("overScore").textContent="MAX COMBO "+game.maxCombo;
document.getElementById("overLv").textContent=game.lv;
document.getElementById("overCombo").textContent=game.combo;
document.getElementById("overHi").textContent=highScore;
}

/* RETRY */
document.getElementById("retryBtn").onclick=()=>{
gameOver.style.display="none";
showHome();
};

/* INIT */
showHome();

</script>

</body>
</html>
