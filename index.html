<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<title>あざらしサイト｜無料サイト集</title>
<meta name="description" content="あざらしサイトはドット絵変換、カラーパレット生成、などブラウザで使えるツールとあざらし叩きのようなミニゲームができるサイトです。">

<style>
body{
  margin:0;
  background:#0f1115;
  color:#e6e6eb;
  font-family:sans-serif;
  text-align:center;
}

h1{
  margin-top:20px;
  font-size:28px;
}

p.subtitle{
  color:#aaa;
  margin-bottom:10px;
}

.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.card{
  width:260px;
  background:#171a21;
  border:1px solid #2a2f3a;
  border-radius:12px;
  padding:15px;
  text-decoration:none;
  color:#e6e6eb;
  transition:0.2s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#4a90ff;
}

/* 画像エリア */
.card-image{
  position:relative;
}

/* 画像 */
.card-image img{
  width:100%;
  border-radius:8px;
  display:block;
}

/* バッジ横並び */
.badge-container{
  position:absolute;
  top:8px;
  right:8px;
  display:flex;
  gap:6px;
  z-index:5;
}

/* バッジ共通 */
.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
  color:white;
  line-height:1;
  white-space:nowrap;
  backdrop-filter:blur(6px);
  box-shadow:0 2px 8px rgba(0,0,0,0.35);
}

/* NEW */
.badge.new{
  background:linear-gradient(135deg,#ff4d6d,#ff7b00);
}

/* UPDATE */
.badge.update{
  background:linear-gradient(135deg,#00bfff,#0066ff);
}

/* BETA */
.badge.beta{
  background:linear-gradient(135deg,#9b5cff,#5f27cd);
}

/* Coming Soon */
.badge.soon{
  background:linear-gradient(135deg,#00c896,#00e0ff);
}

.card h2{
  font-size:18px;
  margin:10px 0 5px;
}

.card p{
  font-size:14px;
  color:#aaa;
}

.footer{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  background:linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.85));
  backdrop-filter:blur(10px);
  border-radius:12px;
  padding:10px;
  text-align:center;
  font-size:13px;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
  z-index:999;
}

.footer a{
  color:#66ccff;
  text-decoration:none;
  font-weight:600;
}

.footer a:hover{
  text-decoration:underline;
}

.footer .copyright{
  font-size:13px;
  font-weight:500;
  background:linear-gradient(90deg,#ffffff,#bbbbbb);
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  letter-spacing:0.3px;
  text-shadow:0 1px 2px rgba(0,0,0,0.6);
}

body{
  padding-bottom:80px;
}
</style>
</head>

<body>

<h1>あざらしサイト</h1>
<p class="subtitle">ブラウザで使える無料サイト集</p>

<div class="container">

<!-- tool -->
<a href="tool" class="card">
    <div class="card-image">
    <div class="badge-container">

    </div>
    <img src="images/tool.png" alt="ツール集">
  </div>
  <h2>tool</h2>
  <p>無料ツール集</p>
</a>

<!-- game -->
<a href="game" class="card">
      <div class="card-image">
    <div class="badge-container">
			
    </div>
    <img src="images/game.png" alt="game集">
  </div>
  <h2>game</h2>
  <p>無料game集</p>
</a>

<!-- form -->
<a href="https://forms.gle/hWGc1BU5jwBsFDXD8" class="card">
      <div class="card-image">
    <div class="badge-container">
			<div class="badge new">NEW</div>
      <div class="badge soon">回答をお願い致します。</div>
    </div>
    <img src="images/form.png" alt="アンケート画像">
  </div>
  <h2>あざらしサイトアンケート</h2>
  <p>回答にご協力下さい。</p>
</a>

<!-- update -->
<a href="update" class="card">
      <div class="card-image">
    <div class="badge-container">
			
    </div>
    <img src="images/noimage.png" alt="update履歴">
  </div>
  <h2>リリース履歴</h2>
  <p>あざらしサイト内のサイト全てのアップデート履歴</p>
</a>

</div>

<div class="footer">
  <div class="copyright">
    Copyright © 2026 SirogomaAZARASI All Rights Reserved.
  </div>
</div>

</body>
</html>
