<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アップデート履歴 | AZAsite</title>

<style>
:root{
  --bg:#0f0f10;
  --card:#1c1c20;
  --text:#fff;
  --sub:#aaa;
  --btn:#2a2a2e;
  --active:#4c6fff;
  --tag-bg:#333;
}

body.light{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#111;
  --sub:#555;
  --btn:#e5e5e5;
  --active:#2f6bff;
  --tag-bg:#e9e9e9;
}

body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  background:var(--card);
  padding:12px;
}

h1{font-size:16px;margin:0;}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:8px;
}

input{
  flex:1;
  padding:8px;
  border-radius:8px;
  border:0;
  outline:none;
}

button{
  border:0;
  padding:8px 10px;
  border-radius:8px;
  background:var(--btn);
  color:var(--text);
  cursor:pointer;
}

button.active{
  background:var(--active);
}

#list{padding:12px;}

.card{
  background:var(--card);
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}

.site{font-size:12px;color:var(--sub);}
.version{font-weight:bold;margin:4px 0;}
.date{font-size:12px;color:var(--sub);}

.tag{
  display:inline-block;
  font-size:12px;
  padding:3px 8px;
  border-radius:999px;
  margin:3px 4px 0 0;
  background:var(--tag-bg);
}
.tag.feature{background:#4c6fff;color:#fff;}
.tag.fix{background:#ff4c4c;color:#fff;}
.tag.improve{background:#2ecc71;color:#fff;}
.tag.security{background:#ffb300;color:#000;}
</style>
</head>

<body>

<header>
  <h1>リリースノートポータル</h1>

  <div class="row">
    <input id="search" placeholder="検索">
    <button id="themeBtn">🌓 自動</button>
  </div>

  <div class="row" id="siteFilters"></div>
  <div class="row" id="tagFilters"></div>
</header>

<div id="list"></div>

<script>

// ===============================
// ■ 外部JSON
// ===============================
const DATA_URL = "./data.json";

let data = [];

// ===============================
let currentSite = "all";
let currentTag = "all";
let searchText = "";
let themeMode = "auto";

const tagMap = {
  feature: "新機能",
  fix: "修正",
  improve: "改善",
  security: "セキュリティ"
};

// ===============================
// 初期化
// ===============================
init();

async function init(){
  await loadData();
  renderFilters();
  renderTagFilters();
  renderList();
  applyTheme();
  updateThemeButton();
}

// ===============================
// ■ JSON読み込み
// ===============================
async function loadData(){
  try{
    const res = await fetch(DATA_URL);
    data = await res.json();
  }catch(e){
    console.log("JSON読み込み失敗");
    data = [];
  }
}

// ===============================
// ■ サイトフィルタ
// ===============================
function renderFilters(){
  const el = document.getElementById("siteFilters");
  el.innerHTML = "";

  const sites = ["all", ...new Set(data.map(d => d.site))];

  sites.forEach(s=>{
    const btn = document.createElement("button");
    btn.textContent = s === "all" ? "全部" : s;

    if(currentSite === s) btn.classList.add("active");

    btn.onclick = ()=>{
      currentSite = s;
      renderFilters();
      renderList();
    };

    el.appendChild(btn);
  });
}

// ===============================
// ■ タグフィルタ
// ===============================
function renderTagFilters(){
  const el = document.getElementById("tagFilters");
  el.innerHTML = "";

  const tags = [
    {en:"all", ja:"全部"},
    {en:"feature", ja:"新機能"},
    {en:"fix", ja:"修正"},
    {en:"improve", ja:"改善"},
    {en:"security", ja:"セキュリティ"}
  ];

  tags.forEach(t=>{
    const btn = document.createElement("button");
    btn.textContent = t.ja;

    if(currentTag === t.en) btn.classList.add("active");

    btn.onclick = ()=>{
      currentTag = t.en;
      renderTagFilters();
      renderList();
    };

    el.appendChild(btn);
  });
}

// ===============================
// ■ 描画
// ===============================
function renderList(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  let filtered = data.filter(d=>{
    const siteOk = currentSite === "all" || d.site === currentSite;

    const tagOk =
      currentTag === "all" ||
      (d.tags || []).includes(currentTag);

    const text = (
      d.site +
      d.version +
      d.title +
      d.content +
      (d.tags || []).map(t => tagMap[t] || t).join("")
    ).toLowerCase();

    const searchOk = text.includes(searchText.toLowerCase());

    return siteOk && tagOk && searchOk;
  });

  filtered.sort((a,b)=> new Date(b.date) - new Date(a.date));

  filtered.forEach(d=>{
    const div = document.createElement("div");
    div.className = "card";

    const tags = (d.tags||[]).map(t=>{
      const jp = tagMap[t] || t;
      return `<span class="tag ${t}">${jp}</span>`;
    }).join("");

    div.innerHTML = `
      <div class="site">${d.site}</div>
      <div class="version">v${d.version} — ${d.title}</div>
      <div class="date">${d.date}</div>
      <div>${tags}</div>
      <p>${d.content}</p>
    `;

    list.appendChild(div);
  });
}

// ===============================
document.getElementById("search").addEventListener("input",(e)=>{
  searchText = e.target.value;
  renderList();
});

// ===============================
// ■ テーマ
// ===============================
function applyTheme(){
  const mq = window.matchMedia("(prefers-color-scheme: dark)");

  if(themeMode === "dark"){
    document.body.classList.remove("light");
  }
  else if(themeMode === "light"){
    document.body.classList.add("light");
  }
  else {
    document.body.classList.toggle("light", !mq.matches);
  }
}

function updateThemeButton(){
  const btn = document.getElementById("themeBtn");

  if(themeMode === "auto") btn.textContent = "🌓 自動";
  if(themeMode === "dark") btn.textContent = "🌙 ダーク";
  if(themeMode === "light") btn.textContent = "☀ ライト";
}

document.getElementById("themeBtn").onclick = ()=>{
  if(themeMode === "auto") themeMode = "dark";
  else if(themeMode === "dark") themeMode = "light";
  else themeMode = "auto";

  applyTheme();
  updateThemeButton();
};

window.matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", ()=>{
    if(themeMode === "auto") applyTheme();
  });

</script>

</body>
</html>
