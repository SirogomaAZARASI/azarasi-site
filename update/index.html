<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>リリースノートポータル</title>

<style>
:root{
  --bg:#0f0f10;
  --card:#1c1c20;
  --text:#ffffff;
  --sub:#aaaaaa;
  --btn:#2a2a2e;
  --active:#4c6fff;
  --tag-bg:#333333;
  --border:#2a2a2e;
}

body.light{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#111111;
  --sub:#555555;
  --btn:#e5e5e5;
  --active:#2f6bff;
  --tag-bg:#ececec;
  --border:#dddddd;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:12px;
}

h1{
  margin:0;
  font-size:20px;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

input{
  flex:1;
  min-width:220px;
  border:none;
  outline:none;
  border-radius:10px;
  padding:10px;
  background:var(--bg);
  color:var(--text);
}

button{
  border:none;
  cursor:pointer;
  border-radius:10px;
  padding:10px 12px;
  background:var(--btn);
  color:var(--text);
}

button.active{
  background:var(--active);
  color:#fff;
}

#list{
  padding:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

.site{
  font-size:12px;
  color:var(--sub);
}

.version{
  margin-top:4px;
  font-size:18px;
  font-weight:700;
}

.date{
  margin-top:4px;
  color:var(--sub);
  font-size:12px;
}

.content{
  margin-top:10px;
  line-height:1.6;
}

.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  margin-right:6px;
  margin-top:6px;
  font-size:12px;
}

.tag.feature{
  background:#4c6fff;
  color:white;
}

.tag.fix{
  background:#ff4c4c;
  color:white;
}

.tag.improve{
  background:#2ecc71;
  color:white;
}

.tag.security{
  background:#ffb300;
  color:black;
}

.release-gallery{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-top:12px;
  padding-bottom:4px;
}

.release-gallery img{
  max-height:220px;
  border-radius:12px;
  cursor:pointer;
  flex-shrink:0;
  border:1px solid var(--border);
}

.empty{
  text-align:center;
  color:var(--sub);
  padding:40px 10px;
}
</style>
</head>

<body>

<header>

<h1>リリースノートポータル</h1>

<div class="row">
  <input
    id="search"
    placeholder="検索（サイト名・内容・タグ）"
  >

  <button id="themeBtn">
    🌓 自動（OS）
  </button>
</div>

<div class="row" id="siteFilters"></div>

<div class="row" id="tagFilters"></div>

</header>

<div id="list"></div>

<script>

const DATA_URL = "./data.json";

let data = [];

let currentSite = "all";
let currentTag = "all";
let searchText = "";
let themeMode = "auto";

const tagMap = {
  feature:"新機能",
  fix:"修正",
  improve:"改善",
  security:"セキュリティ"
};

init();

async function init(){

  await loadData();

  renderSiteFilters();

  renderTagFilters();

  renderList();

  applyTheme();

  updateThemeButton();
}

async function loadData(){

  try{

    const res = await fetch(DATA_URL);

    data = await res.json();

  }catch(err){

    console.error(err);

    data = [];
  }
}

// ===============================
// サイトフィルタ
// ===============================
function renderSiteFilters(){

  const el = document.getElementById("siteFilters");

  el.innerHTML = "";

  const sites = [
    "all",
    ...new Set(data.map(item => item.site))
  ];

  sites.forEach(site=>{

    const btn = document.createElement("button");

    btn.textContent =
      site === "all"
      ? "全部"
      : site;

    if(site === currentSite){
      btn.classList.add("active");
    }

    btn.onclick = ()=>{

      currentSite = site;

      renderSiteFilters();

      renderList();
    };

    el.appendChild(btn);

  });

}

// ===============================
// タグフィルタ
// ===============================
function renderTagFilters(){

  const el = document.getElementById("tagFilters");

  el.innerHTML = "";

  const tags = [
    {en:"all",ja:"全部"},
    {en:"feature",ja:"新機能"},
    {en:"fix",ja:"修正"},
    {en:"improve",ja:"改善"},
    {en:"security",ja:"セキュリティ"}
  ];

  tags.forEach(tag=>{

    const btn = document.createElement("button");

    btn.textContent = tag.ja;

    if(tag.en === currentTag){
      btn.classList.add("active");
    }

    btn.onclick = ()=>{

      currentTag = tag.en;

      renderTagFilters();

      renderList();
    };

    el.appendChild(btn);

  });

}

// ===============================
// 検索
// ===============================
document
.getElementById("search")
.addEventListener("input",(e)=>{

  searchText = e.target.value;

  renderList();

});

// ===============================
// 一覧描画
// ===============================
function renderList(){

  const list = document.getElementById("list");

  list.innerHTML = "";

  let filtered = data.filter(item=>{

    const siteOk =
      currentSite === "all"
      || item.site === currentSite;

    const tagOk =
      currentTag === "all"
      || (item.tags || []).includes(currentTag);

    const searchSource = (

      item.site +

      item.version +

      item.title +

      item.content +

      (item.tags || [])
      .map(tag=>tagMap[tag] || tag)
      .join(" ")

    ).toLowerCase();

    const searchOk =
      searchSource.includes(
        searchText.toLowerCase()
      );

    return (
      siteOk &&
      tagOk &&
      searchOk
    );

  });

  filtered.sort((a,b)=>
    new Date(b.date)
    -
    new Date(a.date)
  );

  if(filtered.length === 0){

    list.innerHTML = `
      <div class="empty">
        該当するリリースがありません
      </div>
    `;

    return;
  }

  filtered.forEach(item=>{

    const card = document.createElement("div");

    card.className = "card";

    const tagsHtml =
      (item.tags || [])
      .map(tag=>{

        const label =
          tagMap[tag] || tag;

        return `
          <span class="tag ${tag}">
            ${label}
          </span>
        `;

      })
      .join("");

    const galleryHtml =
      (item.images || []).length

      ?

        `
        <div class="release-gallery">

        ${item.images
          .map(image=>`

            <img
              src="${image}"
              alt="${item.title}"
              loading="lazy"
              onclick="window.open('${image}','_blank')"
            >

          `)
          .join("")
        }

        </div>
        `

      :

        "";

    card.innerHTML = `

      <div class="site">
        ${item.site}
      </div>

      <div class="version">
        v${item.version}
        —
        ${item.title}
      </div>

      <div class="date">
        ${item.date}
      </div>

      <div>
        ${tagsHtml}
      </div>

      <div class="content">
        ${item.content}
      </div>

      ${galleryHtml}

    `;

    list.appendChild(card);

  });

}

// ===============================
// テーマ
// ===============================

function applyTheme(){

  const mediaQuery =
    window.matchMedia(
      "(prefers-color-scheme: dark)"
    );

  if(themeMode === "dark"){

    document.body.classList.remove("light");

  }
  else if(themeMode === "light"){

    document.body.classList.add("light");

  }
  else{

    document.body.classList.toggle(
      "light",
      !mediaQuery.matches
    );

  }

}

function updateThemeButton(){

  const btn =
    document.getElementById(
      "themeBtn"
    );

  if(themeMode === "auto"){

    btn.textContent =
      "🌓 自動（OS）";

  }
  else if(themeMode === "dark"){

    btn.textContent =
      "🌙 ダーク";

  }
  else{

    btn.textContent =
      "☀ ライト";

  }

}

// ===============================
// 3モード切替
// ===============================

document
.getElementById("themeBtn")
.onclick = ()=>{

  if(themeMode === "auto"){

    themeMode = "dark";

  }
  else if(themeMode === "dark"){

    themeMode = "light";

  }
  else{

    themeMode = "auto";

  }

  applyTheme();

  updateThemeButton();

};

// ===============================
// OS変更追従
// ===============================

window
.matchMedia(
  "(prefers-color-scheme: dark)"
)
.addEventListener(
  "change",
  ()=>{

    if(themeMode === "auto"){

      applyTheme();

    }

  }
);

// ===============================
// リロードボタンを後で追加したい時用
// ===============================

async function reloadData(){

  await loadData();

  renderSiteFilters();

  renderTagFilters();

  renderList();

}

// ===============================
// script終了
// ===============================

</script>

</body>
</html>
