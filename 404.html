<style>
*{
    box-sizing:border-box;
}

html, body{
    height:100%;
}

/* 背景固定 */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#4facfe,#00f2fe,#43e97b,#38f9d7);
    z-index:-1;
}

body{
    margin:0;
    min-height:100vh;

    font-family:-apple-system,BlinkMacSystemFont,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    /* 🔥 ここが余白の本体 */
    padding:160px 80px;
}

/* ガラスコンテナ（少し小さく） */
.container{
    width:100%;
    max-width:780px;

    position:relative;
    overflow:hidden;

    background:rgba(255,255,255,0.22);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border:1px solid rgba(255,255,255,0.35);
    border-radius:24px;

    padding:40px;
    text-align:center;

    box-shadow:0 20px 50px rgba(0,0,0,0.15);
}

/* 光レイヤー */
.container::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:24px;

    background:linear-gradient(
        135deg,
        rgba(255,255,255,0.45),
        rgba(255,255,255,0.05)
    );

    pointer-events:none;
}

/* テキスト */
.site-title{
    font-size:28px;
    font-weight:700;
    color:#222;
    margin-bottom:30px;
}

.code{
    font-size:120px;
    font-weight:900;
    color:#111;
    line-height:1;
    margin:0;
}

.notfound{
    font-size:32px;
    font-weight:700;
    color:#333;
    margin:10px 0 30px;
}

/* 画像 */
.image-box{
    border:1px solid rgba(255,255,255,0.4);
    border-radius:20px;
    padding:20px;
    margin:0 auto 30px;

    max-width:650px;
    min-height:260px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(255,255,255,0.18);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.image-box img{
    max-width:100%;
    max-height:320px;
    border-radius:12px;
}

/* メッセージ */
.message{
    font-size:18px;
    color:#333;
    margin-bottom:25px;
}

.home-btn{
    display:inline-block;
    padding:14px 30px;
    border-radius:999px;
    text-decoration:none;
    font-size:16px;
    font-weight:700;
    color:#fff;
    background:#333;
    transition:.2s;
}

.home-btn:hover{
    background:#111;
}
