<style>

<body>


<div class="container">


<h1>
シリアル番号生成ツール
</h1>


<h2>
発行
</h2>


<input
id="number"
type="number"
placeholder="number1">


<input
id="issue"
type="number"
placeholder="number2">


<button onclick="generate()">
生成
</button>


<div class="box">

<div>
シリアル番号
</div>

<div
class="serial"
id="serial">
----
</div>


<button onclick="copySerial()">
コピー
</button>

</div>



<h2>
解析
</h2>


<input
id="decodeInput"
placeholder="AAAA-BBBB-CCCC">


<button onclick="decode()">
解析
</button>



<div class="box result">

<div>
number1：
<span id="outNumber">
-
</span>
</div>


<div>
number2：
<span id="outIssue">
-
</span>
</div>


</div>



</div>

  </div>

<script>


//=====================
// Base36 4桁固定
//=====================


function to36Fixed(num){

    return Number(num)
    .toString(36)
    .toUpperCase()
    .padStart(4,"0");

}



function from36Fixed(text){

    return parseInt(text,36);

}



//=====================
// ランダム4文字
//=====================


function random4(){


    const chars =
    "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";


    let result="";


    for(let i=0;i<4;i++){

        result +=
        chars[
            Math.floor(
                Math.random()*chars.length
            )
        ];

    }


    return result;


}



//=====================
// 生成
//=====================


function generate(){


    const number =
    document.getElementById("number")
    .value;


    const issue =
    document.getElementById("issue")
    .value;



    if(number==="" || issue===""){

        alert("入力してください");

        return;

    }



    const numberCode =
    to36Fixed(number);


    const issueCode =
    to36Fixed(issue);



    const randomCode =
    random4();



    const serial =

    numberCode
    + "-"
    + issueCode
    + "-"
    + randomCode;



    document.getElementById("serial")
    .textContent=serial;


}



//=====================
// 解析
//=====================


function decode(){


    const serial =

    document.getElementById("decodeInput")
    .value
    .toUpperCase();



    const parts =
    serial.split("-");



    if(parts.length!==3){

        alert("形式が違います");

        return;

    }



    const number =

    from36Fixed(parts[0]);



    const issue =

    from36Fixed(parts[1]);



    document.getElementById("outNumber")
    .textContent=number;



    document.getElementById("outIssue")
    .textContent=issue;


}



//=====================
// コピー
//=====================


function copySerial(){


    const text =

    document.getElementById("serial")
    .textContent;



    navigator.clipboard.writeText(text);


    alert("コピーしました");


}



</script>
