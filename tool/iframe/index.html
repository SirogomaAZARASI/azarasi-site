<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Iframeツール | AZAtool</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-DK3VQGQTWC"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-DK3VQGQTWC');
</script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:sans-serif;
}

#topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:60px;
    padding:10px;
    display:flex;
    gap:10px;
    background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    z-index:10;
}

input{
    flex:1;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    padding:0 20px;
    border:none;
    border-radius:8px;
    background:#4f46e5;
    color:white;
    cursor:pointer;
}

iframe{
    position:fixed;
    top:60px;
    left:0;
    width:100%;
    height:calc(100% - 60px);
    border:none;
}

#error{
    position:fixed;
    top:60px;
    left:0;
    width:100%;
    height:calc(100% - 60px);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#f5f5f5;
    text-align:center;
}

#error h2{
    margin:0;
}

#error p{
    color:#666;
}
</style>
</head>

<body>

<div id="topbar">
    <input id="url" placeholder="https://example.com">
    <button onclick="openSite()">開く</button>
</div>

<iframe id="frame"></iframe>

<div id="error">
    <h2>⚠ ページを表示できません</h2>
    <p>
        このサイトはiframeでの表示を禁止している可能性があります。
    </p>
</div>

<script>

const frame=document.getElementById("frame");
const error=document.getElementById("error");

function openSite(){

    let url=document.getElementById("url").value.trim();

    if(!url)return;

    if(!url.startsWith("http://") &&
       !url.startsWith("https://")){
        url="https://"+url;
    }

    error.style.display="none";
    frame.style.display="block";

    frame.src=url;

    clearTimeout(window.checkTimer);

    window.checkTimer=setTimeout(()=>{

        try{

            const test=frame.contentDocument;

        }catch(e){

            frame.style.display="none";
            error.style.display="flex";

        }

    },3000);

}

frame.onload=()=>{

    error.style.display="none";
    frame.style.display="block";

};

</script>

</body>
</html>
