<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>効果音ぽんだし</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:20px;
    padding-bottom:120px;
    background:#111;
    color:white;
    font-family:sans-serif;
    overflow-x:hidden;
    touch-action:pan-y;
}

#headerImage{
    width:100%;
    aspect-ratio:3/1;
    object-fit:cover;
    border-radius:24px;
    margin-bottom:20px;
}

h1{
    margin:0 0 8px 0;
}

#description{
    color:#bbb;
    font-size:14px;
    line-height:1.6;
    margin-bottom:20px;
}

input[type="file"]{
    margin-bottom:20px;
    color:white;
}

#panicStopBtn{
    margin-bottom:20px;
    width:100%;
    padding:16px 10px;
    border:none;
    border-radius:16px;
    background:
    linear-gradient(
    180deg,
    #ff2a2a,
    #c40000);

    color:white;

    font-size:20px;
    font-weight:bold;

    line-height:1.5;

    letter-spacing:.5px;

    cursor:pointer;

    box-shadow:
    0 0 20px
    rgba(255,0,0,.35);

    animation:
    panicFlash 1s linear infinite;
}

#panicStopBtn:active{
    transform:scale(0.98);
}

@keyframes panicFlash{

    0%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.25);
    }

    100%{
        filter:brightness(1);
    }
}

#fadeToggleWrap,
#fadeInToggleWrap{
    margin-bottom:12px;
    color:#ccc;
    font-size:14px;
}

#fadeToggle,
#fadeInToggle{
    transform:scale(1.2);
    margin-right:6px;
}

#soundList{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(150px,1fr));
    gap:16px;
}

.sound-wrapper{
    position:relative;
}

.sound-btn{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border:none;
    border-radius:24px;
    background:#444;
    color:white;
    overflow:hidden;
    padding:14px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    user-select:none;
    transition:
    background .2s,
    transform .15s;
    touch-action:manipulation;
    cursor:pointer;
}

.sound-btn.playing{
    background:#d80000;
}

.sound-btn:active{
    transform:scale(0.98);
}

.sound-name{
    width:100%;
    font-size:15px;
    font-weight:bold;
    text-align:center;
    line-height:1.25;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:3;
    overflow:hidden;
    word-break:break-word;
    min-height:58px;
    margin-top:2px;
}

.sound-time{
    position:absolute;
    left:12px;
    right:12px;
    bottom:34px;
    font-size:12px;
    color:#ccc;
    text-align:center;
    pointer-events:none;
}

.fade-label{
    font-size:12px;
    color:#ffcc00;
    margin-bottom:8px;
    display:none;
}

.sound-bar-wrap{
    position:absolute;
    left:12px;
    right:12px;
    bottom:12px;
    height:16px;
    z-index:5;
}

.sound-bar-wrap::before{
    content:"";
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:100%;
    height:4px;
    background:#3a3a3a;
    border-radius:999px;
}

.sound-bar-track{
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:0%;
    height:4px;
    background:white;
    border-radius:999px;
    pointer-events:none;
}

.sound-bar{
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:100%;
    height:16px;
    appearance:none;
    background:transparent;
    z-index:2;
}

.sound-bar::-webkit-slider-thumb{
    appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:white;
}

.menu{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.92);
    border-radius:24px;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
    z-index:9999;
}

.menu button{
    width:110px;
    border:none;
    border-radius:12px;
    padding:10px;
    background:#222;
    color:white;
}

.footer{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    background:
    linear-gradient(
    to right,
    rgba(0,0,0,.2),
    rgba(0,0,0,.85));

    backdrop-filter:blur(10px);

    border-radius:12px;

    padding:10px;

    text-align:center;

    font-size:13px;

    border:
    1px solid
    rgba(255,255,255,.15);

    box-shadow:
    0 5px 20px
    rgba(0,0,0,.3);

    z-index:999;
}

.footer .copyright{

    font-size:13px;
    font-weight:500;

    background:
    linear-gradient(
    90deg,#fff,#bbb);

    background-clip:text;
    -webkit-background-clip:text;

    color:transparent;
    -webkit-text-fill-color:transparent;

    letter-spacing:.3px;

    text-shadow:
    0 1px 2px
    rgba(0,0,0,.6);
}

</style>
</head>

<body>

<img
id="headerImage"
src="pondasi.png">

<h1>効果音ぽんだし</h1>

<div id="fadeToggleWrap">

<label>

<input
type="checkbox"
id="fadeToggle"
checked>

フェードアウト

</label>

</div>

<div id="fadeInToggleWrap">

<label>

<input
type="checkbox"
id="fadeInToggle"
checked>

フェードイン

</label>

</div>

<p id="description">

タップ：再生 / 停止<br>
ダブルタップ：最初へ<br>
トリプルタップ：メニュー<br>
スライド：シーク

</p>

<input
type="file"
id="fileInput"
multiple
accept=".mp3,.wav,.m4a,.aac,.ogg,.mp4,audio/*,video/mp4">

<button id="panicStopBtn">

◤◢◤◢◤◢◤◢◤◢◤◢◤◢◤◢◤◢<br>

緊急停止 Emergency Stop<br>

◤◢◤◢◤◢◤◢◤◢◤◢◤◢◤◢◤◢

</button>

<div id="soundList"></div>

<script>

const soundList =
document.getElementById(
"soundList");

const allAudios = [];

let fadeEnabled = true;
let fadeInEnabled = true;

document
.getElementById("fadeToggle")
.addEventListener(
"change",
e=>{
    fadeEnabled =
    e.target.checked;
});

document
.getElementById("fadeInToggle")
.addEventListener(
"change",
e=>{
    fadeInEnabled =
    e.target.checked;
});

document
.getElementById("fileInput")
.addEventListener(
"change",
e=>{

    for(const file of e.target.files){

        createSound(file);

    }

});

function createSound(file){

    const url =
    URL.createObjectURL(file);

    const audio =
    new Audio(url);

    allAudios.push(audio);

    audio.preload =
    "metadata";

    audio.playsInline =
    true;

    const wrapper =
    document.createElement("div");

    wrapper.className =
    "sound-wrapper";

    const button =
    document.createElement("button");

    button.type =
    "button";

    button.className =
    "sound-btn";

    const fadeLabel =
    document.createElement("div");

    fadeLabel.className =
    "fade-label";

    const name =
    document.createElement("div");

    name.className =
    "sound-name";

    name.textContent =
    file.name;

    const time =
    document.createElement("div");

    time.className =
    "sound-time";

    time.textContent =
    "0:00/0:00";

    const barWrap =
    document.createElement("div");

    barWrap.className =
    "sound-bar-wrap";

    const barTrack =
    document.createElement("div");

    barTrack.className =
    "sound-bar-track";

    const bar =
    document.createElement("input");

    bar.type = "range";
    bar.min = 0;
    bar.max = 100;
    bar.value = 0;

    bar.className =
    "sound-bar";

    barWrap.appendChild(barTrack);
    barWrap.appendChild(bar);

    button.appendChild(fadeLabel);
    button.appendChild(name);
    button.appendChild(time);
    button.appendChild(barWrap);

    wrapper.appendChild(button);

    const menu =
    document.createElement("div");

    menu.className =
    "menu";

    menu.innerHTML = `
    <button class="rename">名前変更</button>
    <button class="delete">削除</button>
    <button class="close">閉じる</button>
    `;

    wrapper.appendChild(menu);

    soundList.appendChild(wrapper);

    let seeking = false;
    let tapCount = 0;
    let tapTimer = null;

    let fadeOutInterval = null;
    let fadeInInterval = null;

    function setPlaying(v){

        button.classList.toggle(
        "playing",
        v);

    }

    function formatTime(sec){

        sec =
        Math.floor(sec || 0);

        const m =
        Math.floor(sec / 60);

        const s =
        sec % 60;

        return `${m}:${String(s)
        .padStart(2,"0")}`;

    }

    function updateTime(){

        time.textContent =
        `${formatTime(audio.currentTime)}/${formatTime(audio.duration)}`;

        if(audio.duration && !seeking){

            const v =
            (audio.currentTime
            / audio.duration)
            * 100;

            bar.value = v;

            barTrack.style.width =
            v + "%";
        }
    }

    function stopFadeIntervals(){

        if(fadeOutInterval){

            clearInterval(
            fadeOutInterval);

            fadeOutInterval = null;
        }

        if(fadeInInterval){

            clearInterval(
            fadeInInterval);

            fadeInInterval = null;
        }

    }

    function fadeOutStop(){

        stopFadeIntervals();

        if(!fadeEnabled){

            audio.pause();

            setPlaying(false);

            return;
        }

        fadeLabel.style.display =
        "block";

        fadeLabel.textContent =
        "フェードアウト中...";

        let vol =
        audio.volume;

        const duration =
        5000;

        const stepTime =
        16;

        const step =
        vol / (duration / stepTime);

        fadeOutInterval =
        setInterval(()=>{

            vol -= step;

            if(vol <= 0){

                audio.volume = 0;

                stopFadeIntervals();

                audio.pause();

                audio.volume = 1;

                fadeLabel.style.display =
                "none";

                setPlaying(false);

                return;
            }

            audio.volume = vol;

        },stepTime);

    }

    function playWithFade(){

        stopFadeIntervals();

        const isResumePlay =
        audio.currentTime > 0;

        if(
            fadeInEnabled &&
            isResumePlay
        ){

            fadeLabel.style.display =
            "block";

            fadeLabel.textContent =
            "フェードイン中...";

            audio.volume = 0;

        }else{

            fadeLabel.style.display =
            "none";

            audio.volume = 1;

        }

        audio.play()
        .then(()=>{

            setPlaying(true);

            if(
                !fadeInEnabled ||
                !isResumePlay
            ){
                return;
            }

            let vol = 0;

            const duration =
            5000;

            const stepTime =
            16;

            const step =
            1 / (duration / stepTime);

            fadeInInterval =
            setInterval(()=>{

                vol += step;

                if(vol >= 1){

                    vol = 1;

                    audio.volume = 1;

                    fadeLabel.style.display =
                    "none";

                    stopFadeIntervals();

                    return;
                }

                audio.volume = vol;

            },stepTime);

        });

    }

    button.addEventListener(
    "click",
    e=>{

        if(e.target === bar){

            return;
        }

        tapCount++;

        clearTimeout(tapTimer);

        tapTimer =
        setTimeout(()=>{

            if(tapCount === 1){

                if(audio.paused){

                    playWithFade();

                }else{

                    fadeOutStop();

                }

            }

            else if(tapCount === 2){

                audio.currentTime = 0;

                updateTime();

            }

            else if(tapCount >= 3){

                menu.style.display =
                "flex";

            }

            tapCount = 0;

        },250);

    });

    bar.addEventListener(
    "pointerdown",
    e=>{

        e.stopPropagation();

        seeking = true;

    });

    bar.addEventListener(
    "input",
    ()=>{

        if(audio.duration){

            const v =
            Number(bar.value);

            audio.currentTime =
            (v / 100)
            * audio.duration;

            barTrack.style.width =
            v + "%";
        }

    });

    bar.addEventListener(
    "pointerup",
    ()=>{

        requestAnimationFrame(()=>{

            seeking = false;

        });

    });

    audio.addEventListener(
    "timeupdate",
    updateTime);

    audio.addEventListener(
    "loadedmetadata",
    updateTime);

    audio.addEventListener(
    "pause",
    ()=>{

        setPlaying(false);

    });

    audio.addEventListener(
    "ended",
    ()=>{

        audio.currentTime = 0;

        updateTime();

        setPlaying(false);

    });

    menu.querySelector(
    ".rename")
    .onclick = ()=>{

        const n =
        prompt(
        "名前変更",
        name.textContent);

        if(n?.trim()){

            name.textContent =
            n.trim();

        }

    };

    menu.querySelector(
    ".delete")
    .onclick = ()=>{

        stopFadeIntervals();

        audio.pause();

        audio.src = "";

        wrapper.remove();

    };

    menu.querySelector(
    ".close")
    .onclick = ()=>{

        menu.style.display =
        "none";

    };

}

document
.getElementById(
"panicStopBtn")
.addEventListener(
"click",
()=>{

    allAudios.forEach(audio=>{

        audio.pause();

        audio.volume = 1;

    });

    document
    .querySelectorAll(
    ".sound-btn")
    .forEach(btn=>{

        btn.classList.remove(
        "playing");

    });

    document
    .querySelectorAll(
    ".fade-label")
    .forEach(label=>{

        label.style.display =
        "none";

    });

});

</script>

<div class="footer">

<div class="copyright">

</div>

</div>

</body>
</html>
