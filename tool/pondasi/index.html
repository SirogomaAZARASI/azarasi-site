<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>効果音ぽんだし</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:sans-serif;
    overflow-x:hidden;
}

#headerImage{
    width:100%;
    aspect-ratio:3/1;
    object-fit:cover;
    border-radius:24px;
    margin-bottom:20px;
}

h1{
    margin:0 0 8px 0;
}

#description{
    color:#bbb;
    font-size:14px;
    line-height:1.6;
    margin-bottom:20px;
}

input[type="file"]{
    margin-bottom:20px;
    color:white;
}

/* ===== grid ===== */
#soundList{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:16px;
}

/* ===== tile ===== */
.sound-wrapper{
    position:relative;
}

.sound-btn{
    width:100%;
    aspect-ratio:1/1;
    border:none;
    border-radius:24px;
    background:#444;
    color:white;
    padding:12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    user-select:none;
    transition:0.2s;

    position:relative;
    z-index:1;
}

/* 再生中 */
.sound-btn.playing{
    background:#d80000;
}

/* 並び替え */
.sound-btn.sorting{
    animation:wiggle 0.12s infinite alternate;
}

@keyframes wiggle{
    from{transform:rotate(-1deg);}
    to{transform:rotate(1deg);}
}

.sound-name{
    font-size:15px;
    font-weight:bold;
    width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-bottom:6px;
}

.sound-time{
    font-size:12px;
    color:#ccc;
    margin-bottom:6px;
}

/* ===== bar ===== */

.sound-bar-wrap{
    position:relative;
    width:100%;
    height:14px;
    z-index:1;
}

/* グレー背景 */
.sound-bar-wrap::before{
    content:"";
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:100%;
    height:4px;
    background:#3a3a3a;
    border-radius:999px;
    z-index:0;
}

/* 操作用 */
.sound-bar{
    width:100%;
    height:4px;
    appearance:none;
    background:transparent;

    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    z-index:2;
}

/* 白進捗 */
.sound-bar-track{
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    height:4px;
    width:0%;
    background:white;
    border-radius:999px;
    pointer-events:none;
    z-index:1;
}

/* thumb */
.sound-bar::-webkit-slider-thumb{
    appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#fff;
}

/* ===== menu（最前面固定） ===== */

.menu{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.92);
    border-radius:24px;

    display:none;

    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;

    z-index:9999; /* ←ここが重要 */
}

.menu button{
    width:110px;
    border:none;
    border-radius:12px;
    padding:10px;
    background:#222;
    color:white;
}

#doneBtn{
    position:fixed;
    right:20px;
    bottom:20px;
    padding:14px 18px;
    border:none;
    border-radius:14px;
    background:#d80000;
    color:white;
    z-index:9999;
}

</style>

</head>

<body>

<img id="headerImage" src="pondasi.png">

<h1>効果音ぽんだし</h1>

<p id="description">
タップ：再生/停止<br>
ダブルタップ：最初に戻る<br>
スライド：シーク<br>
トリプルタップ：メニュー
</p>

<input type="file" id="fileInput" multiple accept="audio/*,video/mp4">

<div id="soundList"></div>

<script>

const soundList = document.getElementById("soundList");

let sortMode = false;
let draggedWrapper = null;

document.getElementById("fileInput").addEventListener("change", e=>{
    for(const file of e.target.files){
        createSound(file);
    }
});

function createSound(file){

    const url = URL.createObjectURL(file);
    const audio = new Audio(url);

    const wrapper = document.createElement("div");
    wrapper.className = "sound-wrapper";

    const button = document.createElement("button");
    button.className = "sound-btn";

    const name = document.createElement("div");
    name.className = "sound-name";
    name.textContent = file.name;

    const time = document.createElement("div");
    time.className = "sound-time";

    const barWrap = document.createElement("div");
    barWrap.className = "sound-bar-wrap";

    const bar = document.createElement("input");
    bar.type = "range";
    bar.min = 0;
    bar.max = 100;
    bar.value = 0;
    bar.className = "sound-bar";

    const barTrack = document.createElement("div");
    barTrack.className = "sound-bar-track";

    barWrap.appendChild(barTrack);
    barWrap.appendChild(bar);

    button.appendChild(name);
    button.appendChild(time);
    button.appendChild(barWrap);

    wrapper.appendChild(button);
    soundList.appendChild(wrapper);

    const menu = document.createElement("div");
    menu.className = "menu";

    menu.innerHTML = `
        <button class="sort">並べ替え</button>
        <button class="rename">名前変更</button>
        <button class="delete">削除</button>
        <button class="close">閉じる</button>
    `;

    wrapper.appendChild(menu);

    const sortBtn = menu.querySelector(".sort");
    const renameBtn = menu.querySelector(".rename");
    const deleteBtn = menu.querySelector(".delete");
    const closeBtn = menu.querySelector(".close");

    let tapCount = 0;
    let tapTimer;
    let moved = false;
    let longPressTimer;
    let longPressSeek = false;
    let seeking = false;
    let smooth = 0;

    function setPlaying(v){
        button.classList.toggle("playing", v);
    }

    function formatTime(sec){
        sec = Math.floor(sec || 0);
        const m = Math.floor(sec/60);
        const s = sec%60;
        return `${m}:${String(s).padStart(2,"0")}`;
    }

    /* ===== smooth bar ===== */
    function animate(){
        if(audio.duration){
            const target = (audio.currentTime / audio.duration) * 100;
            smooth += (target - smooth) * 0.15;

            barTrack.style.width = smooth + "%";
            bar.value = smooth;
        }
        requestAnimationFrame(animate);
    }
    animate();

    /* ===== tap ===== */
    button.addEventListener("touchstart", e=>{

        moved = false;

        if(sortMode){
            startDrag(e, wrapper);
            return;
        }

        clearTimeout(longPressTimer);
        longPressSeek = false;

        longPressTimer = setTimeout(()=>{
            if(tapCount === 2){
                longPressSeek = true;
            }
        },220);

    },{passive:true});

    button.addEventListener("touchmove", ()=>{
        moved = true;
        clearTimeout(longPressTimer);
    });

    button.addEventListener("touchend", ()=>{

        clearTimeout(longPressTimer);

        if(sortMode) return;
        if(moved) return;
        if(longPressSeek) return;

        tapCount++;

        clearTimeout(tapTimer);

        tapTimer = setTimeout(()=>{

            if(tapCount === 1){

                if(audio.paused){
                    audio.play();
                    setPlaying(true);
                }else{
                    audio.pause();
                    setPlaying(false);
                }

            }else if(tapCount === 2){

                audio.currentTime = 0;
                audio.pause();
                setPlaying(false);

                bar.value = 0;
                barTrack.style.width = "0%";
                updateTime();

            }else if(tapCount >= 3){

                menu.style.display = "flex";
            }

            tapCount = 0;

        },250);

    });

    /* ===== seek ===== */

    bar.addEventListener("input", ()=>{

        seeking = true;

        audio.currentTime =
        (bar.value / 100) * audio.duration;

        barTrack.style.width = bar.value + "%";
    });

    bar.addEventListener("touchend", ()=>{
        seeking = false;
    });

    audio.addEventListener("timeupdate", updateTime);
    audio.addEventListener("loadedmetadata", updateTime);
    audio.addEventListener("seeked", updateTime);

    audio.addEventListener("ended", ()=>{
        audio.currentTime = 0;
        audio.pause();
        setPlaying(false);
        updateTime();
    });

    function updateTime(){

        const cur = formatTime(audio.currentTime);
        const tot = formatTime(audio.duration);

        time.textContent = `${cur}/${tot}`;

        if(!seeking && audio.duration){
            const v = (audio.currentTime / audio.duration) * 100;
            barTrack.style.width = v + "%";
            bar.value = v;
        }
    }

    /* ===== menu ===== */

    sortBtn.onclick = ()=> enableSortMode();

    renameBtn.onclick = ()=>{
        const n = prompt("名前変更", name.textContent);
        if(n?.trim()) name.textContent = n.trim();
    };

    deleteBtn.onclick = ()=> wrapper.remove();

    closeBtn.onclick = ()=> menu.style.display = "none";

    function enableSortMode(){

        sortMode = true;
        menu.style.display = "none";

        document.querySelectorAll(".sound-btn")
        .forEach(b=>b.classList.add("sorting"));

        if(document.getElementById("doneBtn")) return;

        const doneBtn = document.createElement("button");
        doneBtn.id = "doneBtn";
        doneBtn.textContent = "完了";
        document.body.appendChild(doneBtn);

        doneBtn.onclick = ()=>{

            sortMode = false;

            document.querySelectorAll(".sound-btn")
            .forEach(b=>b.classList.remove("sorting"));

            document.querySelectorAll(".sound-wrapper")
            .forEach(w=>w.classList.remove("dragging"));

            doneBtn.remove();
        };
    }

}

/* ===== drag ===== */

function startDrag(e, wrapper){

    draggedWrapper = wrapper;
    wrapper.classList.add("dragging");

    function move(ev){

        const t = ev.touches[0];
        const list = [...document.querySelectorAll(".sound-wrapper")];

        for(const el of list){

            if(el === draggedWrapper) continue;

            const r = el.getBoundingClientRect();

            if(
                t.clientX > r.left &&
                t.clientX < r.right &&
                t.clientY > r.top &&
                t.clientY < r.bottom
            ){
                soundList.insertBefore(
                    draggedWrapper,
                    t.clientY < r.top + r.height/2 ? el : el.nextSibling
                );
                break;
            }
        }
    }

    function end(){
        wrapper.classList.remove("dragging");
        document.removeEventListener("touchmove", move);
        document.removeEventListener("touchend", end);
    }

    document.addEventListener("touchmove", move, {passive:true});
    document.addEventListener("touchend", end);
}

</script>

</body>
</html>
