<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPSロガー | AZAtool</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:sans-serif;
    background:#f3f4f6;
    padding:15px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin-top:0;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

button{
    border:none;
    border-radius:12px;
    padding:14px;
    cursor:pointer;
    font-size:15px;
}

.start{
    background:#22c55e;
    color:white;
}

.pause{
    background:#f59e0b;
    color:white;
}

.resume{
    background:#3b82f6;
    color:white;
}

.stop{
    background:#ef4444;
    color:white;
}

.save{
    background:#8b5cf6;
    color:white;
}

.clear{
    background:#555;
    color:white;
}

.info{
    background:#f1f5f9;
    border-radius:12px;
    padding:15px;
    line-height:1.8;
    margin-bottom:15px;
}

#log{
    background:#111;
    color:#00ff88;
    height:300px;
    overflow:auto;
    border-radius:12px;
    padding:10px;
    font-size:12px;
    white-space:pre-wrap;
}

.footer{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  background:linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.85));
  backdrop-filter:blur(10px);
  border-radius:12px;
  padding:10px;
  text-align:center;
  font-size:13px;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
  z-index:999;
}

.footer a{
  color:#66ccff;
  text-decoration:none;
  font-weight:600;
}

.footer a:hover{
  text-decoration:underline;
}

.footer .copyright{
  font-size:13px;
  font-weight:500;
  background:linear-gradient(90deg,#ffffff,#bbbbbb);
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  letter-spacing:0.3px;
  text-shadow:0 1px 2px rgba(0,0,0,0.6);
}

body{padding-bottom:80px;}

</style>
</head>

<body>

<div class="container">

<h1>GPSロガー Pro</h1>

<div class="buttons">

<button id="startBtn" class="start">
開始
</button>

<button id="pauseBtn" class="pause">
一時停止
</button>

<button id="resumeBtn" class="resume">
再開
</button>

<button id="stopBtn" class="stop">
停止
</button>

<button id="saveBtn" class="save">
KML保存
</button>

<button id="clearBtn" class="clear">
履歴削除
</button>

</div>

<div class="info">

状態：
<span id="state">待機中</span>

<br>

記録点数：
<span id="count">0</span>

<br>

緯度：
<span id="lat">-</span>

<br>

経度：
<span id="lon">-</span>

<br>

高度：
<span id="alt">-</span>

</div>

<div id="log"></div>

</div>

<div class="footer">
  <a href="../">← ツール一覧に戻る</a><br>
  <div class="copyright">
    Copyright © 2026 SirogomaAZARASI All Rights Reserved.
  </div>
</div>

<script>

let db;

let watchId=null;

let paused=false;

const DB_NAME="GPSLoggerDB";

const STORE_NAME="points";

function addLog(text){

    const log=
    document.getElementById("log");

    log.textContent+=text+"\n";

    log.scrollTop=
    log.scrollHeight;
}

function updateState(text){

    document
    .getElementById("state")
    .textContent=text;
}

function updateCount(value){

    document
    .getElementById("count")
    .textContent=value;
}

function openDatabase(){

    return new Promise(
        (resolve,reject)=>{

        const request=
        indexedDB.open(
            DB_NAME,
            1
        );

        request.onupgradeneeded=
        event=>{

            db=
            event.target.result;

            if(
                !db.objectStoreNames
                .contains(STORE_NAME)
            ){

                db.createObjectStore(
                    STORE_NAME,
                    {
                        keyPath:"id",
                        autoIncrement:true
                    }
                );

            }
        };

        request.onsuccess=
        event=>{

            db=
            event.target.result;

            resolve();
        };

        request.onerror=
        ()=>reject();
    });
}

function savePoint(point){

    return new Promise(
        (resolve,reject)=>{

        const tx=
        db.transaction(
            STORE_NAME,
            "readwrite"
        );

        const store=
        tx.objectStore(
            STORE_NAME
        );

        const req=
        store.add(point);

        req.onsuccess=
        ()=>resolve();

        req.onerror=
        ()=>reject();
    });
}

function getAllPoints(){

    return new Promise(
        (resolve,reject)=>{

        const tx=
        db.transaction(
            STORE_NAME,
            "readonly"
        );

        const store=
        tx.objectStore(
            STORE_NAME
        );

        const req=
        store.getAll();

        req.onsuccess=
        ()=>resolve(req.result);

        req.onerror=
        ()=>reject();
    });
}

function clearAllPoints(){

    return new Promise(
        (resolve,reject)=>{

        const tx=
        db.transaction(
            STORE_NAME,
            "readwrite"
        );

        const store=
        tx.objectStore(
            STORE_NAME
        );

        const req=
        store.clear();

        req.onsuccess=
        ()=>resolve();

        req.onerror=
        ()=>reject();
    });
}

async function refreshCount(){

    const points=
    await getAllPoints();

    updateCount(
        points.length
    );
}

async function startLogging(){

    if(
        !navigator.geolocation
    ){
        alert(
            "GPS未対応"
        );
        return;
    }

    if(
        watchId!==null
    ){
        return;
    }

    paused=false;

    updateState(
        "記録中"
    );

    watchId=
    navigator.geolocation
    .watchPosition(

    async position=>{

        if(paused){
            return;
        }

        const point={

            lat:Number(
                position.coords
                .latitude
                .toFixed(6)
            ),

            lon:Number(
                position.coords
                .longitude
                .toFixed(6)
            ),

            alt:Number(
                (
                    position.coords
                    .altitude || 0
                )
                .toFixed(1)
            ),

            accuracy:Number(
                position.coords
                .accuracy
                .toFixed(1)
            ),

            time:
            new Date()
            .toISOString()
        };

        await savePoint(
            point
        );

        document
        .getElementById("lat")
        .textContent=
        point.lat;

        document
        .getElementById("lon")
        .textContent=
        point.lon;

        document
        .getElementById("alt")
        .textContent=
        point.alt;

        addLog(
            "[" +
            point.time +
            "]\n" +
            point.lat +
            "," +
            point.lon
        );

        refreshCount();

    },

    error=>{

        addLog(
            "GPSエラー: " +
            error.message
        );

    },

    {
        enableHighAccuracy:true,
        maximumAge:0,
        timeout:10000
    }

    );
}

function pauseLogging(){

    paused=true;

    updateState(
        "一時停止"
    );

    addLog(
        "=== 一時停止 ==="
    );
}

function resumeLogging(){

    paused=false;

    updateState(
        "記録中"
    );

    addLog(
        "=== 再開 ==="
    );
}

function stopLogging(){

    if(
        watchId!==null
    ){

        navigator
        .geolocation
        .clearWatch(
            watchId
        );

        watchId=null;
    }

    updateState(
        "停止"
    );

    addLog(
        "=== 停止 ==="
    );
}

function generateKML(points){

    if(points.length===0){
        return "";
    }

    const start=
    points[0];

    const end=
    points[
        points.length-1
    ];

    let coordinates="";

    for(
        const p of points
    ){

        coordinates+=
        `${p.lon},${p.lat},${p.alt}\n`;

    }

    return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>

<name>GPS Log</name>

<Placemark>
<name>開始地点</name>
<Point>
<coordinates>
${start.lon},${start.lat},${start.alt}
</coordinates>
</Point>
</Placemark>

<Placemark>
<name>終了地点</name>
<Point>
<coordinates>
${end.lon},${end.lat},${end.alt}
</coordinates>
</Point>
</Placemark>

<Placemark>
<name>移動軌跡</name>
<LineString>
<tessellate>1</tessellate>
<coordinates>
${coordinates}
</coordinates>
</LineString>
</Placemark>

</Document>
</kml>`;
}

async function saveKML(){

    const points=
    await getAllPoints();

    if(
        points.length===0
    ){

        alert(
            "保存するデータがありません"
        );

        return;
    }

    const kml=
    generateKML(
        points
    );

    const blob=
    new Blob(
        [kml],
        {
            type:
            "application/vnd.google-earth.kml+xml"
        }
    );

    const url=
    URL.createObjectURL(
        blob
    );

    const a=
    document.createElement(
        "a"
    );

    a.href=url;

    a.download=
    "gpslog_" +
    Date.now() +
    ".kml";

    document.body
    .appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(
        url
    );

    addLog(
        "KML保存完了"
    );
}

async function clearLogs(){

    if(
        !confirm(
            "記録を削除しますか？"
        )
    ){
        return;
    }

    await clearAllPoints();

    updateCount(0);

    document
    .getElementById("lat")
    .textContent="-";

    document
    .getElementById("lon")
    .textContent="-";

    document
    .getElementById("alt")
    .textContent="-";

    document
    .getElementById("log")
    .textContent="";

    addLog(
        "履歴削除"
    );
}

async function initialize(){

    await openDatabase();

    const points=
    await getAllPoints();

    updateCount(
        points.length
    );

    addLog(
        "IndexedDB接続完了"
    );

    addLog(
        "保存済み地点数: " +
        points.length
    );

    if(
        points.length>0
    ){

        const last=
        points[
            points.length-1
        ];

        document
        .getElementById("lat")
        .textContent=
        last.lat;

        document
        .getElementById("lon")
        .textContent=
        last.lon;

        document
        .getElementById("alt")
        .textContent=
        last.alt;
    }
}

document
.getElementById(
    "startBtn"
)
.onclick=
startLogging;

document
.getElementById(
    "pauseBtn"
)
.onclick=
pauseLogging;

document
.getElementById(
    "resumeBtn"
)
.onclick=
resumeLogging;

document
.getElementById(
    "stopBtn"
)
.onclick=
stopLogging;

document
.getElementById(
    "saveBtn"
)
.onclick=
saveKML;

document
.getElementById(
    "clearBtn"
)
.onclick=
clearLogs;

initialize();

</script>

</body>
</html>
