*{
  box-sizing:border-box;
}

html{
  height:100%;
  overflow:hidden;
}

body{
  margin:0;
  display:flex;

  width:100%;
  height:100dvh;

  overflow:hidden;

  padding-top:
  env(safe-area-inset-top);

  padding-bottom:80px;

  background:#f5f5f5;

  font-family:
  "Noto Sans JP",
  "Noto Sans SC",
  "Noto Sans TC",
  "Noto Sans KR",
  "Noto Sans Arabic",
  "Noto Sans Devanagari",
  "Noto Sans Thai",

/* =========================
ローディング
========================= */

#fontLoader{
  position:fixed;
  inset:0;

  background:#111;
  color:#fff;

  z-index:999999;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.4s;
}

.loaderBox{
  text-align:center;
}

.spinner{
  width:48px;
  height:48px;

  border:5px solid #444;
  border-top:5px solid #fff;

  border-radius:50%;

  animation:spin 1s linear infinite;

  margin:auto;
  margin-bottom:14px;
}

.loaderText{
  font-size:16px;
}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}


/* =========================
サイドバー
========================= */

#sidebar{
  width:320px;

  flex-shrink:0;

  background:#1e1e1e;
  color:#fff;

  overflow:auto;

  padding:10px;
}

#searchBox{
  width:100%;

  padding:10px;

  border:none;
  outline:none;

  border-radius:8px;

  margin-bottom:10px;

  font-size:14px;
}

.block{
  padding:8px;

  margin:2px 0;

  background:#2c2c2c;

  border-radius:6px;

  cursor:pointer;

  font-size:13px;

  user-select:none;
}

.block:hover{
  background:#444;
}

.block:active{
  background:#555;
}


/* =========================
メイン
========================= */

#main{
  flex:1;

  display:flex;
  flex-direction:column;

  background:#f5f5f5;

  min-width:0;
}

header{
  background:#111;

  color:#fff;

  padding:
  calc(env(safe-area-inset-top) + 10px)
  10px
  10px;

  font-size:18px;

  position:sticky;

  top:0;

  z-index:100;
}


/* =========================
Unicode一覧
========================= */

#container{
  flex:1;

  overflow:auto;

  position:relative;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior:contain;
}

#spacer{
  height:0;
}

#grid{
  position:absolute;

  top:0;
  left:0;
  right:0;

  width:100%;

  display:grid;

  grid-template-columns:
  repeat(auto-fill,minmax(80px,1fr));

  gap:6px;

  padding:10px;

  align-content:start;
}


/* =========================
セル
========================= */

.cell{
  background:#fff;

  border:1px solid #ddd;

  border-radius:8px;

  text-align:center;

  padding:8px;

  cursor:pointer;

  position:relative;

  min-height:72px;

  overflow:hidden;

  user-select:none;

  transition:
  background .15s,
  transform .1s;
}

.cell:hover{
  background:#dff0ff;
}

.cell:active{
  transform:scale(.97);
}

.char{
  font-size:24px;

  word-break:break-word;

  line-height:1.3;

  min-height:32px;
}

.code{
  font-size:10px;

  color:#666;

  word-break:break-all;

  margin-top:4px;
}

.star{
  position:absolute;

  top:4px;
  right:4px;

  font-size:14px;

  cursor:pointer;

  user-select:none;

  z-index:2;
}

.star.active{
  color:gold;
}


/* =========================
特殊領域
========================= */

.cell.unavailable{
  opacity:.4;

  cursor:default;

  background:#eee;
}

.cell.unavailable:hover{
  background:#eee;
}

.cell.unassigned{
  opacity:.5;

  background:#f2f2f2;
}


/* =========================
Toast
========================= */

#toast{
  position:fixed;

  bottom:20px;

  left:50%;

  transform:translateX(-50%);

  background:#333;

  color:#fff;

  padding:6px 12px;

  border-radius:20px;

  opacity:0;

  transition:.3s;

  z-index:9999;

  pointer-events:none;

  white-space:nowrap;
}


/* =========================
フッター
========================= */

.footer{
  position:fixed;

  bottom:
  calc(env(safe-area-inset-bottom) + 10px);

  left:50%;

  transform:translateX(-50%);

  width:90%;

  background:
  linear-gradient(
    to right,
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.85)
  );

  backdrop-filter:blur(10px);

  border-radius:12px;

  padding:10px;

  text-align:center;

  font-size:13px;

  border:1px solid rgba(255,255,255,0.15);

  box-shadow:
  0 5px 20px rgba(0,0,0,0.3);

  z-index:999;
}

.footer a{
  color:#66ccff;

  text-decoration:none;

  font-weight:600;
}

.footer a:hover{
  text-decoration:underline;
}

.footer .copyright{
  font-size:13px;

  font-weight:500;

  background:
  linear-gradient(
    90deg,
    #ffffff,
    #bbbbbb
  );

  background-clip:text;

  -webkit-background-clip:text;

  color:transparent;

  -webkit-text-fill-color:transparent;

  letter-spacing:.3px;

  text-shadow:
  0 1px 2px rgba(0,0,0,.6);
}


/* =========================
スマートフォン
========================= */

@media(max-width:700px){

  #sidebar{
    width:220px;
  }

  .block{
    font-size:12px;
  }

  #grid{
    grid-template-columns:
    repeat(auto-fill,minmax(72px,1fr));
  }

}

2F800..2FA1F; CJK Compatibility Ideographs Supplement
30000..3134F; CJK Unified Ideographs Extension G
31350..323AF; CJK Unified Ideographs Extension H
323B0..3347F; CJK Unified Ideographs Extension J
3D000..3FC3F; Seal
E0000..E007F; Tags
E0100..E01EF; Variation Selectors Supplement
F0000..FFFFF; Supplementary Private Use Area-A
100000..10FFFF; Supplementary Private Use Area-B

`
.trim()
.split("\n")
.filter(Boolean)
.map(line=>{

  const [range,name] =
    line.split(";");

  return {
    name:name.trim(),
    range:range.trim().replace("..","-")
  };

});


/* =========================================================
DOM
========================================================= */

const list =
  document.getElementById("list");

const grid =
  document.getElementById("grid");

const container =
  document.getElementById("container");

const spacer =
  document.getElementById("spacer");

const searchBox =
  document.getElementById("searchBox");

const toast =
  document.getElementById("toast");


/* =========================================================
お気に入り
========================================================= */

let favoriteMode=false;

let favorites=[];

try{

  favorites =
    JSON.parse(
      localStorage.getItem("unicodeFav") || "[]"
    );

  if(!Array.isArray(favorites)){
    favorites=[];
  }

}catch{

  favorites=[];

}


function saveFav(){

  try{

    localStorage.setItem(
      "unicodeFav",
      JSON.stringify(favorites)
    );

  }catch(error){

    console.warn(
      "お気に入り保存エラー:",
      error
    );

  }

}


function toggleFavorite(code,starEl){

  const index =
    favorites.indexOf(code);

  if(index!==-1){

    favorites.splice(index,1);

    if(starEl){
      starEl.classList.remove("active");
    }

  }else{

    favorites.unshift(code);

    if(starEl){
      starEl.classList.add("active");
    }

  }

  saveFav();

  if(favoriteMode){

    showFavorites();

  }

}


function showFavorites(){

  favoriteMode=true;

  grid.innerHTML="";

  grid.style.top="0px";

  spacer.style.height="0px";

  if(favorites.length===0){

    const message =
      document.createElement("div");

    message.style.padding="20px";

    message.style.gridColumn="1/-1";

    message.textContent=
      "お気に入りはありません";

    grid.appendChild(message);

    return;

  }

  favorites.forEach(code=>{

    createCell(
      code,
      grid
    );

  });

}


/* =========================================================
ブロック一覧
========================================================= */

blocks.forEach(block=>{

  const div =
    document.createElement("div");

  div.className="block";

  div.textContent=block.name;

  div.onclick=()=>{

    try{

      loadBlock(block.range);

    }catch(error){

      console.error(
        "ブロック読み込みエラー:",
        error
      );

      showError(
        "このブロックを読み込めませんでした"
      );

    }

  };

  list.appendChild(div);

});


/* =========================================================
Toast
========================================================= */

let toastTimer=null;

function showError(message){

  toast.textContent=message;

  toast.style.opacity="1";

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{

    toast.style.opacity="0";

    toast.textContent="コピーしました";

  },1800);

}


/* =========================================================
仮想スクロール
========================================================= */

let start=0;

let end=0;

const CELL_H=95;

const ROWS=60;

let cols=6;

let lastVisibleRow=-1;

let ticking=false;


/* =========================================================
列数計算
========================================================= */

function updateCols(){

  const width =
    grid.clientWidth ||
    container.clientWidth ||
    320;

  cols =
    Math.max(
      1,
      Math.floor(
        (width-20)/86
      )
    );

}


/* =========================================================
ブロック読み込み
========================================================= */

function loadBlock(range){

  if(typeof range!=="string"){
    throw new Error(
      "Unicode rangeがありません"
    );
  }

  const parts =
    range.split("-");

  if(parts.length!==2){

    throw new Error(
      "Unicode rangeが不正です"
    );

  }

  const s =
    parseInt(
      parts[0],
      16
    );

  const e =
    parseInt(
      parts[1],
      16
    );

  if(
    Number.isNaN(s) ||
    Number.isNaN(e) ||
    s<0 ||
    e>0x10FFFF ||
    s>e
  ){

    throw new Error(
      "Unicode rangeが不正です"
    );

  }

  favoriteMode=false;

  start=s;

  end=e;

  container.scrollTop=0;

  lastVisibleRow=-1;

  grid.style.top="0px";

  updateSpacer();

  render();

}


/* =========================================================
スペーサー
========================================================= */

function updateSpacer(){

  updateCols();

  const total =
    end-start+1;

  const totalRows =
    Math.ceil(
      total/cols
    );

  spacer.style.height =
    Math.max(
      0,
      totalRows*CELL_H
    )+"px";

}


/* =========================================================
Unicodeセル
========================================================= */

function createCellElement(code){

  if(
    !Number.isInteger(code) ||
    code<0 ||
    code>0x10FFFF
  ){

    return null;

  }


  /*
    UTF-16 surrogate

    D800～DFFFは単独のUnicode
    コードポイントとして表示できない。
  */

  if(
    code>=0xD800 &&
    code<=0xDFFF
  ){

    return createUnavailableCell(code);

  }


  try{

    const ch =
      String.fromCodePoint(code);

    const div =
      document.createElement("div");

    div.className="cell";


    const active =
      favorites.includes(code);


    const star =
      document.createElement("div");

    star.className =
      "star" +
      (active ? " active" : "");

    star.textContent="★";


    const char =
      document.createElement("div");

    char.className="char";

    /*
      textContentを使うことで
      特殊文字がHTMLとして解釈されない。
    */

    char.textContent=ch;


    const codeEl =
      document.createElement("div");

    codeEl.className="code";

    codeEl.textContent =
      "U+" +
      code
        .toString(16)
        .toUpperCase()
        .padStart(4,"0");


    div.appendChild(star);

    div.appendChild(char);

    div.appendChild(codeEl);


    div.onclick=()=>{

      copy(ch);

    };


    star.onclick=(event)=>{

      event.stopPropagation();

      toggleFavorite(
        code,
        star
      );

    };


    return div;

  }catch(error){

    console.warn(
      "Unicodeセル生成エラー:",
      code,
      error
    );

    return null;

  }

}


/* =========================================================
サロゲート表示
========================================================= */

function createUnavailableCell(code){

  const div =
    document.createElement("div");

  div.className=
    "cell unavailable";


  const char =
    document.createElement("div");

  char.className="char";

  char.textContent="�";


  const codeEl =
    document.createElement("div");

  codeEl.className="code";

  codeEl.textContent =
    "U+" +
    code
      .toString(16)
      .toUpperCase()
      .padStart(4,"0");


  div.appendChild(char);

  div.appendChild(codeEl);


  return div;

}


/* =========================================================
セル追加
========================================================= */

function createCell(code,target){

  const element =
    createCellElement(code);

  if(element){

    target.appendChild(
      element
    );

  }

}


/* =========================================================
仮想スクロール描画
========================================================= */

function render(){

  if(favoriteMode){

    ticking=false;

    return;

  }

  updateCols();


  const scrollTop =
    container.scrollTop;


  const visibleRow =
    Math.floor(
      scrollTop/CELL_H
    );


  const rowStart =
    Math.max(
      0,
      visibleRow-20
    );


  /*
    同じ位置なら再描画しない
  */

  if(
    visibleRow===lastVisibleRow &&
    grid.children.length>0
  ){

    ticking=false;

    return;

  }


  lastVisibleRow=
    visibleRow;


  const fragment =
    document.createDocumentFragment();


  for(
    let r=0;
    r<ROWS;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const index =
        (rowStart+r)*cols+c;


      const code =
        start+index;


      if(code>end){

        continue;

      }


      const cell =
        createCellElement(
          code
        );


      if(cell){

        fragment.appendChild(
          cell
        );

      }

    }

  }


  grid.innerHTML="";

  grid.appendChild(
    fragment
  );


  grid.style.top =
    (rowStart*CELL_H)+"px";


  ticking=false;

}


/* =========================================================
コピー
========================================================= */

async function copy(char){

  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard.writeText(
        char
      );

    }else{

      const textarea =
        document.createElement(
          "textarea"
        );

      textarea.value=char;

      textarea.style.position="fixed";

      textarea.style.opacity="0";

      document.body.appendChild(
        textarea
      );

      textarea.select();

      document.execCommand(
        "copy"
      );

      textarea.remove();

    }


    toast.textContent=
      "コピーしました";

    toast.style.opacity="1";


    clearTimeout(
      toastTimer
    );


    toastTimer =
      setTimeout(()=>{

        toast.style.opacity="0";

      },1000);


  }catch(error){

    console.error(
      "コピーエラー:",
      error
    );

    showError(
      "コピーできませんでした"
    );

  }

}


/* =========================================================
検索
========================================================= */

searchBox.addEventListener(
  "input",
  ()=>{

    favoriteMode=false;

    const q =
      searchBox.value.trim();


    grid.innerHTML="";

    grid.style.top="0px";

    spacer.style.height="0px";


    /*
      空欄
    */

    if(!q){

      lastVisibleRow=-1;

      updateSpacer();

      render();

      return;

    }


    /*
      Unicode入力

      U+3042
      3042
      U+1F600
      1F600
      10FFFF
    */

    const unicodePattern =
      /^(?:U\+)?([0-9A-Fa-f]{2,6})$/;


    const match =
      q.match(
        unicodePattern
      );


    if(match){

      const code =
        parseInt(
          match[1],
          16
        );


      if(
        code>=0 &&
        code<=0x10FFFF
      ){

        createCell(
          code,
          grid
        );

      }else{

        showError(
          "U+10FFFFを超えています"
        );

      }

      return;

    }


    /*
      通常文字
    */

    for(const ch of q){

      const code =
        ch.codePointAt(0);

      createCell(
        code,
        grid
      );

    }

  }
);


/* =========================================================
スクロール
========================================================= */

container.addEventListener(
  "scroll",
  ()=>{

    if(favoriteMode){

      return;

    }


    if(!ticking){

      ticking=true;

      requestAnimationFrame(
        render
      );

    }

  },
  {
    passive:true
  }
);


/* =========================================================
リサイズ
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    if(favoriteMode){

      return;

    }

    lastVisibleRow=-1;

    updateSpacer();

    render();

  }
);


/* =========================================================
ローディング終了
========================================================= */

function hideLoader(){

  const loader =
    document.getElementById(
      "fontLoader"
    );


  if(!loader){

    return;

  }


  loader.style.opacity="0";

  loader.style.pointerEvents=
    "none";


  setTimeout(()=>{

    if(loader.parentNode){

      loader.remove();

    }

  },400);

}


/*
  document.fonts.ready は使わない。

  Google Fontsの読み込みに失敗しても
  ビューアはそのまま使用可能。
*/

if(
  document.readyState==="loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    ()=>{

      setTimeout(
        hideLoader,
        400
      );

    },
    {
      once:true
    }
  );

}else{

  setTimeout(
    hideLoader,
    400
  );

}


/*
  最終安全装置。

  何らかの理由で上記処理が失敗しても
  2秒後には必ずローディングを消す。
*/

setTimeout(
  hideLoader,
  2000
);


/* =========================================================
初期表示
========================================================= */

try{

  loadBlock(
    "3040-309F"
  );

}catch(error){

  console.error(
    "初期表示エラー:",
    error
  );

  showError(
    "Unicodeブロックを読み込めませんでした"
  );

}

</script>
