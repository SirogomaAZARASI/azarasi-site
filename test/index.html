<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">

<title>ITA Corpus Recorder Pro</title>

<style>

:root{
--bg:#f5f7fb;
--card:#ffffff;
--text:#111827;
--sub:#6b7280;
--border:#e5e7eb;
--accent:#2563eb;
--accent-hover:#1d4ed8;
--success:#16a34a;
--danger:#dc2626;
--shadow:0 10px 30px rgba(0,0,0,.08);
}

body.dark{
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--sub:#94a3b8;
--border:#334155;
--accent:#3b82f6;
--accent-hover:#60a5fa;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text);
transition:.3s;
}

header{
position:sticky;
top:0;
z-index:999;
background:var(--card);
border-bottom:1px solid var(--border);
padding:18px;
}

.header-inner{
max-width:1400px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:360px 1fr;
gap:20px;
}

@media(max-width:1000px){
.grid{
grid-template-columns:1fr;
}
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:24px;
padding:20px;
box-shadow:var(--shadow);
}

h1{
font-size:28px;
}

h2{
margin-bottom:18px;
}

.setting{
margin-bottom:18px;
}

.setting label{
display:block;
font-weight:700;
margin-bottom:6px;
}

select,
input[type="text"],
input[type="number"]{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid var(--border);
background:var(--bg);
color:var(--text);
}

.check{
display:flex;
align-items:center;
gap:8px;
margin-top:10px;
}

.btn{
border:none;
padding:12px 18px;
border-radius:14px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
}

.btn-primary{
background:var(--accent);
color:white;
}

.btn-success{
background:var(--success);
color:white;
}

.btn-danger{
background:var(--danger);
color:white;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
}

.reader{
min-height:450px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.corpus-id{
font-size:18px;
color:var(--sub);
margin-bottom:20px;
}

.corpus-text{
font-size:38px;
font-weight:700;
line-height:1.8;
max-width:900px;
}

.corpus-ruby{
margin-top:20px;
font-size:20px;
color:var(--sub);
}

.progress-area{
margin-top:25px;
width:100%;
}

.progress{
height:16px;
background:var(--border);
border-radius:999px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:var(--accent);
transition:.3s;
}

.progress-text{
margin-bottom:8px;
font-weight:700;
}

.meter{
height:18px;
background:var(--border);
border-radius:999px;
overflow:hidden;
margin-top:20px;
}

.meter-bar{
height:100%;
width:0%;
background:linear-gradient(
90deg,
#22c55e,
#eab308,
#ef4444
);
}

.waveform{
height:140px;
border-radius:14px;
border:1px solid var(--border);
margin-top:20px;
background:var(--bg);
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:15px;
}

.stat{
background:var(--bg);
border:1px solid var(--border);
padding:15px;
border-radius:16px;
text-align:center;
}

.stat-value{
font-size:22px;
font-weight:800;
}

.stat-label{
font-size:12px;
color:var(--sub);
}

.export-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}

footer{
text-align:center;
padding:30px;
color:var(--sub);
}

<script>

const corpus = [

{
id:1,
text:"また会えて嬉しいです。",
ruby:"またあえてうれしいです"
},

{
id:2,
text:"今日は良い天気ですね。",
ruby:"きょうはよいてんきですね"
},

{
id:3,
text:"新しい挑戦を始めます。",
ruby:"あたらしいちょうせんをはじめます"
},

{
id:4,
text:"音声モデルを作っています。",
ruby:"おんせいもでるをつくっています"
},

{
id:5,
text:"録音のテストをしています。",
ruby:"ろくおんのてすとをしています"
}

];

let currentIndex = 0;

let recordings = {};

let db = null;

const progressBar =
document.getElementById("progressBar");

const progressText =
document.getElementById("progressText");

const corpusId =
document.getElementById("corpusId");

const corpusText =
document.getElementById("corpusText");

const corpusRuby =
document.getElementById("corpusRuby");

const recordedCountEl =
document.getElementById("recordedCount");

const remainingCountEl =
document.getElementById("remainingCount");

function updateStats(){

const count =
Object.keys(recordings).length;

recordedCountEl.textContent = count;

remainingCountEl.textContent =
corpus.length - count;

}

function updateProgress(){

const count =
Object.keys(recordings).length;

const percent =
(count / corpus.length) * 100;

progressBar.style.width =
percent + "%";

progressText.textContent =
`${count} / ${corpus.length}`;

updateStats();

}

function updateCorpus(){

const item = corpus[currentIndex];

corpusId.textContent =
`No.${String(item.id).padStart(3,"0")}`;

corpusText.textContent =
item.text;

corpusRuby.textContent =
item.ruby;

if(
!document.getElementById("showRuby").checked
){
corpusRuby.style.display = "none";
}else{
corpusRuby.style.display = "block";
}

localStorage.setItem(
"ita_current_index",
currentIndex
);

}

document
.getElementById("showRuby")
.addEventListener("change",()=>{

updateCorpus();

});

document
.getElementById("nextBtn")
.addEventListener("click",()=>{

if(
currentIndex <
corpus.length - 1
){
currentIndex++;
updateCorpus();
}

});

document
.getElementById("prevBtn")
.addEventListener("click",()=>{

if(currentIndex > 0){
currentIndex--;
updateCorpus();
}

});

document
.getElementById("themeBtn")
.addEventListener("click",()=>{

document.body.classList.toggle("dark");

localStorage.setItem(
"ita_theme",
document.body.classList.contains("dark")
? "dark"
: "light"
);

});

if(
localStorage.getItem("ita_theme")
==="dark"
){
document.body.classList.add("dark");
}

const savedIndex =
parseInt(
localStorage.getItem(
"ita_current_index"
) || "0"
);

currentIndex =
Math.min(
savedIndex,
corpus.length - 1
);

updateCorpus();

function openDB(){

return new Promise((resolve,reject)=>{

const request =
indexedDB.open(
"ITARecorderDB",
1
);

request.onupgradeneeded =
(event)=>{

const database =
event.target.result;

if(
!database.objectStoreNames.contains(
"recordings"
)
){

database.createObjectStore(
"recordings",
{
keyPath:"id"
}
);

}

};

request.onsuccess =
(event)=>{

db = event.target.result;
resolve();

};

request.onerror =
reject;

});

}

async function loadRecordings(){

if(!db)return;

return new Promise((resolve)=>{

const tx =
db.transaction(
["recordings"],
"readonly"
);

const store =
tx.objectStore(
"recordings"
);

const request =
store.getAll();

request.onsuccess =
()=>{

recordings = {};

request.result.forEach(item=>{

recordings[item.id] =
item;

});

updateProgress();

resolve();

};

});

}

async function saveRecording(
id,
blob
){

return new Promise((resolve)=>{

const tx =
db.transaction(
["recordings"],
"readwrite"
);

const store =
tx.objectStore(
"recordings"
);

store.put({
id,
blob,
date:Date.now()
});

tx.oncomplete = ()=>{

recordings[id] = {
id,
blob
};

updateProgress();

resolve();

};

});

}

async function initApp(){

await openDB();

await loadRecordings();

updateCorpus();

updateProgress();

}

initApp();

let mediaRecorder;
let audioChunks = [];

let mediaStream;

let analyser;
let audioContext;
let meterAnimation;

const meterBar =
document.getElementById(
"meterBar"
);

async function startMonitoring(){

audioContext =
new AudioContext();

const source =
audioContext.createMediaStreamSource(
mediaStream
);

analyser =
audioContext.createAnalyser();

analyser.fftSize = 256;

source.connect(analyser);

const data =
new Uint8Array(
analyser.frequencyBinCount
);

function drawMeter(){

analyser.getByteFrequencyData(
data
);

let sum = 0;

for(
let i=0;
i<data.length;
i++
){
sum += data[i];
}

const average =
sum / data.length;

meterBar.style.width =
Math.min(
average * 1.5,
100
) + "%";

meterAnimation =
requestAnimationFrame(
drawMeter
);

}

drawMeter();

}

async function startRecording(){

try{

audioChunks = [];

mediaStream =
await navigator.mediaDevices.getUserMedia({

audio:{
echoCancellation:false,
noiseSuppression:false,
autoGainControl:false
}

});

await startMonitoring();

mediaRecorder =
new MediaRecorder(mediaStream);

mediaRecorder.ondataavailable =
(event)=>{

if(event.data.size > 0){

audioChunks.push(
event.data
);

}

};

mediaRecorder.onstop =
async ()=>{

cancelAnimationFrame(
meterAnimation
);

meterBar.style.width = "0%";

const blob =
new Blob(
audioChunks,
{
type:"audio/webm"
}
);

const wavBlob =
await convertToWav(blob);

await saveRecording(
corpus[currentIndex].id,
wavBlob
);

};

mediaRecorder.start();

document.getElementById(
"recordBtn"
).disabled = true;

document.getElementById(
"stopBtn"
).disabled = false;

if(
document.getElementById(
"autoStop"
).checked
){

startSilenceDetection();

}

}catch(error){

alert(
"マイクへのアクセスに失敗しました"
);

console.error(error);

}

}

function stopRecording(){

if(
mediaRecorder &&
mediaRecorder.state !== "inactive"
){

mediaRecorder.stop();

}

if(mediaStream){

mediaStream
.getTracks()
.forEach(track=>track.stop());

}

document.getElementById(
"recordBtn"
).disabled = false;

document.getElementById(
"stopBtn"
).disabled = true;

}

document
.getElementById("recordBtn")
.addEventListener(
"click",
startRecording
);

document
.getElementById("stopBtn")
.addEventListener(
"click",
stopRecording
);

document
.getElementById("rerecordBtn")
.addEventListener(
"click",
async ()=>{

const ok =
confirm(
"現在の録音を上書きしますか？"
);

if(!ok)return;

await startRecording();

}
);

async function convertToWav(blob){

const arrayBuffer =
await blob.arrayBuffer();

const ctx =
new AudioContext();

const audioBuffer =
await ctx.decodeAudioData(
arrayBuffer
);

const sampleRate =
parseInt(
document.getElementById(
"sampleRate"
).value
);

const channels =
parseInt(
document.getElementById(
"channels"
).value
);

const bitDepth =
parseInt(
document.getElementById(
"bitDepth"
).value
);

const rendered =
await resampleBuffer(
audioBuffer,
sampleRate,
channels
);

return encodeWAV(
rendered,
sampleRate,
bitDepth,
channels
);

}

async function resampleBuffer(
audioBuffer,
targetRate,
channels
){

const offline =
new OfflineAudioContext(
channels,
audioBuffer.duration *
targetRate,
targetRate
);

const source =
offline.createBufferSource();

source.buffer =
audioBuffer;

source.connect(
offline.destination
);

source.start(0);

return await offline.startRendering();

}

function encodeWAV(
audioBuffer,
sampleRate,
bitDepth,
channels
){

const samples =
audioBuffer.length;

const bytesPerSample =
bitDepth / 8;

const blockAlign =
channels *
bytesPerSample;

const buffer =
new ArrayBuffer(
44 +
samples *
blockAlign
);

const view =
new DataView(buffer);

writeString(
view,
0,
"RIFF"
);

view.setUint32(
4,
36 +
samples *
blockAlign,
true
);

writeString(
view,
8,
"WAVE"
);

writeString(
view,
12,
"fmt "
);

view.setUint32(
16,
16,
true
);

view.setUint16(
20,
1,
true
);

view.setUint16(
22,
channels,
true
);

view.setUint32(
24,
sampleRate,
true
);

view.setUint32(
28,
sampleRate *
blockAlign,
true
);

view.setUint16(
32,
blockAlign,
true
);

view.setUint16(
34,
bitDepth,
true
);

writeString(
view,
36,
"data"
);

view.setUint32(
40,
samples *
blockAlign,
true
);

let offset = 44;

const channelData = [];

for(
let ch = 0;
ch < channels;
ch++
){

channelData.push(
audioBuffer.getChannelData(
Math.min(
ch,
audioBuffer.numberOfChannels - 1
)
)
);

}

for(
let i=0;
i<samples;
i++
){

for(
let ch=0;
ch<channels;
ch++
){

let sample =
channelData[ch][i];

sample =
Math.max(
-1,
Math.min(
1,
sample
)
);

if(bitDepth===16){

view.setInt16(
offset,
sample < 0
? sample * 32768
: sample * 32767,
true
);

offset += 2;

}else if(bitDepth===24){

let s =
Math.floor(
sample * 8388607
);

view.setUint8(
offset,
s & 255
);

view.setUint8(
offset + 1,
(s >> 8) & 255
);

view.setUint8(
offset + 2,
(s >> 16) & 255
);

offset += 3;

}else{

view.setFloat32(
offset,
sample,
true
);

offset += 4;

}

}

}

return new Blob(
[buffer],
{
type:"audio/wav"
}
);

}

function writeString(
view,
offset,
string
){

for(
let i=0;
i<string.length;
i++
){

view.setUint8(
offset + i,
string.charCodeAt(i)
);

}

}

let silenceTimer = null;

function startSilenceDetection(){

if(!analyser)return;

const data =
new Uint8Array(
analyser.fftSize
);

const silenceThreshold = 8;

const silenceDuration = 2000;

function detect(){

if(
!mediaRecorder ||
mediaRecorder.state !== "recording"
){
return;
}

analyser.getByteTimeDomainData(
data
);

let maxDeviation = 0;

for(
let i=0;
i<data.length;
i++
){

const deviation =
Math.abs(
data[i] - 128
);

if(
deviation > maxDeviation
){
maxDeviation = deviation;
}

}

if(
maxDeviation <
silenceThreshold
){

if(!silenceTimer){

silenceTimer =
Date.now();

}else{

const elapsed =
Date.now() -
silenceTimer;

if(
elapsed >
silenceDuration
){

stopRecording();

return;

}

}

}else{

silenceTimer = null;

}

requestAnimationFrame(
detect
);

}

detect();

}

function drawWaveform(
audioBuffer
){

const canvas =
document.createElement(
"canvas"
);

const wrapper =
document.getElementById(
"waveform"
);

wrapper.innerHTML = "";

canvas.width =
wrapper.clientWidth;

canvas.height =
wrapper.clientHeight;

wrapper.appendChild(
canvas
);

const ctx =
canvas.getContext("2d");

const data =
audioBuffer.getChannelData(
0
);

const step =
Math.ceil(
data.length /
canvas.width
);

const amp =
canvas.height / 2;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.beginPath();

for(
let i=0;
i<canvas.width;
i++
){

let min = 1;
let max = -1;

for(
let j=0;
j<step;
j++
){

const datum =
data[
(i * step) + j
];

if(datum < min)
min = datum;

if(datum > max)
max = datum;

}

ctx.moveTo(
i,
(1 + min) * amp
);

ctx.lineTo(
i,
(1 + max) * amp
);

}

ctx.stroke();

}

async function previewLatestRecording(){

const currentId =
corpus[currentIndex].id;

if(
!recordings[currentId]
)return;

const blob =
recordings[currentId].blob;

const arrayBuffer =
await blob.arrayBuffer();

const ctx =
new AudioContext();

const audioBuffer =
await ctx.decodeAudioData(
arrayBuffer
);

drawWaveform(
audioBuffer
);

}

document
.getElementById("nextBtn")
.addEventListener(
"click",
previewLatestRecording
);

document
.getElementById("prevBtn")
.addEventListener(
"click",
previewLatestRecording
);

const txPreview =
setInterval(
previewLatestRecording,
1000
);

function createCSV(){

let csv =
"file,text\n";

corpus.forEach(item=>{

const filename =
String(item.id)
.padStart(3,"0") +
".wav";

csv +=
`"${filename}","${item.text}"\n`;

});

return csv;

}

document
.getElementById("csvBtn")
.addEventListener(
"click",
()=>{

const csv =
createCSV();

const blob =
new Blob(
[csv],
{
type:"text/csv"
}
);

const url =
URL.createObjectURL(
blob
);

const a =
document.createElement(
"a"
);

a.href = url;

a.download =
"metadata.csv";

a.click();

URL.revokeObjectURL(
url
);

}
);

async function createBackup(){

const exportData = {

settings:{

format:
document.getElementById(
"format"
).value,

sampleRate:
document.getElementById(
"sampleRate"
).value,

bitDepth:
document.getElementById(
"bitDepth"
).value,

channels:
document.getElementById(
"channels"
).value

},

currentIndex,

Object.keys(
recordings
)

};

exportData,
null,
2

],

);

const a =
document.createElement(
"a"
);

"ita-backup.json";

url
);

}

let mediaStream;
let mediaRecorder;
let audioChunks = [];

let audioContext;
let analyser;
let waveformAnimation;

let latestBlob = null;

const waveformEl =
document.getElementById("waveform");

const playBtn =
document.createElement("button");

playBtn.textContent = "再生";
playBtn.className = "btn btn-primary";

document
.querySelector(".actions")
.appendChild(playBtn);

const canvas =
document.createElement("canvas");

canvas.width = 800;
canvas.height = 140;

waveformEl.innerHTML = "";
waveformEl.appendChild(canvas);

const ctx = canvas.getContext("2d");

async function startRecording(){

audioChunks = [];

mediaStream =
await navigator.mediaDevices.getUserMedia({
audio:true
});

audioContext =
new AudioContext();

const source =
audioContext.createMediaStreamSource(
mediaStream
);

analyser =
audioContext.createAnalyser();

analyser.fftSize = 2048;

source.connect(analyser);

drawRealtimeWaveform();

mediaRecorder =
new MediaRecorder(mediaStream);

mediaRecorder.ondataavailable =
e=>{

if(e.data.size>0){

audioChunks.push(e.data);

}

};

mediaRecorder.onstop =
()=>{

latestBlob =
new Blob(
audioChunks,
{
type:"audio/webm"
}
);

cancelAnimationFrame(
waveformAnimation
);

drawStaticWave();

};

mediaRecorder.start();

}

function stopRecording(){

if(
mediaRecorder &&
mediaRecorder.state==="recording"
){

mediaRecorder.stop();

}

if(mediaStream){

mediaStream
.getTracks()
.forEach(
track=>track.stop()
);

}

}

function drawRealtimeWaveform(){

const data =
new Uint8Array(
analyser.fftSize
);

function draw(){

waveformAnimation =
requestAnimationFrame(draw);

analyser.getByteTimeDomainData(
data
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.beginPath();

const sliceWidth =
canvas.width /
data.length;

let x = 0;

for(
let i=0;
i<data.length;
i++
){

const v =
data[i] / 128.0;

const y =
v * canvas.height / 2;

if(i===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

x += sliceWidth;

}

ctx.stroke();

}

draw();

}

async function drawStaticWave(){

if(!latestBlob)return;

const arrayBuffer =
await latestBlob.arrayBuffer();

const tempCtx =
new AudioContext();

const audioBuffer =
await tempCtx.decodeAudioData(
arrayBuffer
);

const data =
audioBuffer.getChannelData(0);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.beginPath();

const step =
Math.ceil(
data.length /
canvas.width
);

const amp =
canvas.height / 2;

for(
let i=0;
i<canvas.width;
i++
){

let min = 1;
let max = -1;

for(
let j=0;
j<step;
j++
){

const datum =
data[
(i*step)+j
];

if(datum<min)
min=datum;

if(datum>max)
max=datum;

}

ctx.moveTo(
i,
(1+min)*amp
);

ctx.lineTo(
i,
(1+max)*amp
);

}

ctx.stroke();

}

playBtn.addEventListener(
"click",
()=>{

if(!latestBlob){

alert("録音がありません");

return;

}

const audio =
new Audio(
URL.createObjectURL(
latestBlob
)
);

audio.play();

}
);

.getElementById("recordBtn")
.addEventListener(
"click",
startRecording
);

document
.getElementById("stopBtn")
.addEventListener(
"click",
stopRecording
);
