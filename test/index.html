<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>USB Music</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    min-height:100vh;

    padding-bottom:140px;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;

    background:rgba(0,0,0,.86);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border-bottom:1px solid #222;
}

.header{
    max-width:1100px;
    margin:auto;

    min-height:62px;

    padding:9px 15px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.logo{
    font-size:20px;
    font-weight:800;

    white-space:nowrap;
}

.header-buttons{
    display:flex;
    gap:7px;
}

.btn{
    border:0;
    border-radius:10px;

    padding:10px 13px;

    background:#fff;
    color:#000;

    font-size:13px;
    font-weight:700;
}

.btn.secondary{
    background:#292929;
    color:#fff;
}


/* =========================
   MAIN
========================= */

main{
    max-width:1100px;
    margin:auto;

    padding:
        18px 15px 170px;
}


/* =========================
   DROP
========================= */

.home{
    min-height:72vh;

    display:flex;
    align-items:center;
    justify-content:center;
}

.drop-zone{
    width:min(680px,100%);
    min-height:330px;

    border:2px dashed #444;
    border-radius:28px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px 20px;

    background:
        radial-gradient(
            circle at center,
            #181818,
            #080808
        );

    transition:.2s;
}

.drop-zone.dragover{
    border-color:#fff;

    background:#202020;

    transform:scale(1.015);
}

.drop-icon{
    width:95px;
    height:95px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            #444,
            #111
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:48px;

    margin-bottom:20px;
}

.drop-zone h1{
    font-size:28px;

    margin-bottom:9px;
}

.drop-zone p{
    color:#888;

    line-height:1.7;
}

.drop-buttons{
    display:flex;
    flex-wrap:wrap;

    justify-content:center;

    gap:8px;

    margin-top:22px;
}

.drop-buttons button{
    border:0;
    border-radius:11px;

    padding:12px 17px;

    background:#fff;
    color:#000;

    font-weight:700;
}

.drop-buttons .secondary{
    background:#292929;
    color:#fff;
}

.note{
    margin-top:20px;

    padding:13px 16px;

    background:#111;

    border:1px solid #292929;

    border-radius:13px;

    color:#777;

    font-size:12px;

    line-height:1.7;
}


/* =========================
   CONTENT
========================= */

.breadcrumb{
    display:flex;
    flex-wrap:wrap;

    align-items:center;

    gap:7px;

    color:#777;

    font-size:13px;

    margin-bottom:10px;
}

.breadcrumb button{
    background:none;
    border:0;

    color:#aaa;

    padding:0;
}

.section-title{
    font-size:28px;

    margin:8px 0 20px;
}

.stats{
    color:#777;

    font-size:13px;

    margin-top:-12px;
    margin-bottom:18px;
}


/* =========================
   ARTIST
========================= */

.artist-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(210px,1fr)
        );

    gap:14px;
}

.artist{
    background:#151515;

    border:1px solid #252525;

    border-radius:17px;

    padding:19px;

    transition:.15s;
}

.artist:active{
    transform:scale(.98);
}

.artist-icon{
    width:65px;
    height:65px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #555,
            #111
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    margin-bottom:14px;

    overflow:hidden;
}

.artist-icon img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.artist-name{
    font-size:17px;
    font-weight:700;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;
}

.artist-sub{
    color:#777;

    font-size:12px;

    margin-top:5px;
}


/* =========================
   ALBUM
========================= */

.album-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px,1fr)
        );

    gap:15px;
}

.album{
    background:#151515;

    border:1px solid #252525;

    border-radius:16px;

    padding:9px;

    transition:.15s;
}

.album:active{
    transform:scale(.98);
}

.album-art{
    aspect-ratio:1;

    border-radius:11px;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #444,
            #111
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:52px;
}

.album-art img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.album-name{
    font-size:15px;
    font-weight:700;

    margin:
        11px 3px 0;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;
}

.album-sub{
    color:#777;

    font-size:12px;

    margin:
        5px 3px 2px;
}


/* =========================
   SONG
========================= */

.songs{
    display:flex;
    flex-direction:column;

    gap:7px;
}

.song{
    min-height:63px;

    display:flex;
    align-items:center;

    gap:12px;

    padding:9px 13px;

    border-radius:12px;

    background:#151515;

    border:1px solid #252525;
}

.song.playing{
    background:#292929;
}

.song-number{
    width:28px;

    text-align:center;

    color:#777;

    font-size:12px;
}

.song-info{
    flex:1;

    min-width:0;
}

.song-title{
    font-size:15px;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;
}

.song-sub{
    color:#777;

    font-size:11px;

    margin-top:3px;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;
}

.song-icon{
    width:30px;

    text-align:center;
}


/* =========================
   PLAYER
========================= */

.player{
    position:fixed;

    z-index:200;

    left:0;
    right:0;
    bottom:0;

    background:rgba(20,20,20,.96);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border-top:1px solid #303030;

    padding:
        10px 14px
        calc(10px + env(safe-area-inset-bottom));
}

.player-inner{
    max-width:1100px;
    margin:auto;
}

.player-main{
    display:flex;

    align-items:center;

    gap:12px;
}

.cover{
    width:50px;
    height:50px;

    flex-shrink:0;

    border-radius:9px;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #444,
            #111
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;
}

.cover img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.current{
    flex:1;

    min-width:0;
}

.current-title{
    font-size:14px;
    font-weight:700;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;
}

.current-artist{
    color:#777;

    font-size:11px;

    margin-top:3px;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;
}

.controls{
    display:flex;

    align-items:center;

    gap:6px;
}

.control{
    width:37px;
    height:37px;

    border:0;

    border-radius:50%;

    background:#303030;

    color:#fff;

    font-size:15px;
}

.control.main{
    width:44px;
    height:44px;

    background:#fff;

    color:#000;

    font-size:18px;
}

.progress{
    display:block;

    width:100%;
    height:4px;

    margin-top:9px;

    appearance:none;
    -webkit-appearance:none;

    background:#444;

    border-radius:10px;
}

.progress::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;

    width:13px;
    height:13px;

    border-radius:50%;

    background:#fff;
}

.times{
    display:flex;

    justify-content:space-between;

    color:#777;

    font-size:9px;

    margin-top:4px;
}


/* =========================
   MESSAGE
========================= */

.message{
    position:fixed;

    z-index:500;

    left:50%;
    bottom:150px;

    transform:translateX(-50%);

    width:max-content;

    max-width:90%;

    padding:12px 16px;

    border-radius:12px;

    background:#222;

    border:1px solid #444;

    color:#fff;

    font-size:13px;

    text-align:center;

    display:none;
}

.message.show{
    display:block;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        min-height:58px;

        padding:
            8px 11px;
    }

    .logo{
        font-size:17px;
    }

    .btn{
        padding:
            9px 10px;

        font-size:11px;
    }

    main{
        padding:
            15px 11px 170px;
    }

    .drop-zone{
        min-height:330px;

        border-radius:22px;
    }

    .drop-zone h1{
        font-size:24px;
    }

    .artist-grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:9px;
    }

    .artist{
        padding:14px;
    }

    .album-grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:9px;
    }

    .album{
        padding:8px;
    }

    .section-title{
        font-size:24px;
    }

    .cover{
        width:43px;
        height:43px;
    }

    .control{
        width:33px;
        height:33px;
    }

    .control.main{
        width:40px;
        height:40px;
    }
}

</style>
</head>


<body>


<header>

<div class="header">

    <div class="logo">
        🎵 USB Music
    </div>

    <div class="header-buttons">

        <button
            class="btn secondary"
            id="folderButton"
        >
            フォルダ
        </button>

        <button
            class="btn"
            id="fileButton"
        >
            曲
        </button>

    </div>

</div>


<input
    id="folderInput"
    type="file"
    webkitdirectory
    directory
    multiple
    hidden
>


<input
    id="fileInput"
    type="file"
    multiple
    accept="
        audio/*,
        .m4a,
        .mp4,
        .mp3,
        .aac,
        .wav,
        .ogg,
        .oga,
        .flac,
        .aiff
    "
    hidden
>

</header>



<main>


<!-- =========================
     HOME
========================= -->

<div
    id="home"
    class="home"
>

<div
    id="dropZone"
    class="drop-zone"
>

    <div class="drop-icon">
        🎵
    </div>

    <h1>
        音楽を追加
    </h1>

    <p>
        USBメモリの音楽フォルダを<br>
        ここへドラッグ＆ドロップ
    </p>

    <div class="drop-buttons">

        <button
            id="dropFolderButton"
        >
            フォルダを選択
        </button>

        <button
            id="dropFileButton"
            class="secondary"
        >
            曲を選択
        </button>

    </div>

    <div class="note">

        M4Aのタグ情報を優先して読み込みます。<br>

        曲名・アーティスト・アルバム・
        トラック番号・ジャケット画像に対応します。<br>

        タグがない場合はフォルダ構造から補完します。

    </div>

</div>

</div>



<!-- =========================
     CONTENT
========================= -->

<div
    id="content"
    class="hidden"
></div>

</main>



<div
    id="message"
    class="message"
></div>



<!-- =========================
     PLAYER
========================= -->

<div class="player">

<div class="player-inner">

<div class="player-main">

    <div
        id="cover"
        class="cover"
    >
        🎵
    </div>


    <div class="current">

        <div
            id="currentTitle"
            class="current-title"
        >
            再生していません
        </div>

        <div
            id="currentArtist"
            class="current-artist"
        >
            USB Music
        </div>

    </div>


    <div class="controls">

        <button
            id="prev"
            class="control"
        >
            ⏮
        </button>

        <button
            id="play"
            class="control main"
        >
            ▶
        </button>

        <button
            id="next"
            class="control"
        >
            ⏭
        </button>

    </div>

</div>


<input
    id="progress"
    class="progress"
    type="range"
    min="0"
    max="100"
    value="0"
>


<div class="times">

    <span id="currentTime">
        0:00
    </span>

    <span id="duration">
        0:00
    </span>

</div>

</div>

</div>



<audio
    id="audio"
    preload="metadata"
></audio>



<script>


/* =========================================================
   ELEMENTS
========================================================= */

const folderButton =
    document.getElementById(
        "folderButton"
    );

const fileButton =
    document.getElementById(
        "fileButton"
    );

const dropFolderButton =
    document.getElementById(
        "dropFolderButton"
    );

const dropFileButton =
    document.getElementById(
        "dropFileButton"
    );

const folderInput =
    document.getElementById(
        "folderInput"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const dropZone =
    document.getElementById(
        "dropZone"
    );

const home =
    document.getElementById(
        "home"
    );

const content =
    document.getElementById(
        "content"
    );

const audio =
    document.getElementById(
        "audio"
    );

const playButton =
    document.getElementById(
        "play"
    );

const prevButton =
    document.getElementById(
        "prev"
    );

const nextButton =
    document.getElementById(
        "next"
    );

const progress =
    document.getElementById(
        "progress"
    );

const currentTitle =
    document.getElementById(
        "currentTitle"
    );

const currentArtist =
    document.getElementById(
        "currentArtist"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const duration =
    document.getElementById(
        "duration"
    );

const cover =
    document.getElementById(
        "cover"
    );

const message =
    document.getElementById(
        "message"
    );


/* =========================================================
   STATE
========================================================= */

let library = {};

let artistNow = "";
let albumNow = "";

let songsNow = [];

let indexNow = -1;

let objectURL = null;

let messageTimer = null;


/* =========================================================
   BUTTONS
========================================================= */

folderButton.onclick =
    () => folderInput.click();

dropFolderButton.onclick =
    () => folderInput.click();

fileButton.onclick =
    () => fileInput.click();

dropFileButton.onclick =
    () => fileInput.click();


/* =========================================================
   INPUT
========================================================= */

folderInput.onchange =
    () => {

        const files =
            Array.from(
                folderInput.files
            );

        if(files.length){
            buildLibrary(files);
        }

    };


fileInput.onchange =
    () => {

        const files =
            Array.from(
                fileInput.files
            );

        if(files.length){
            buildLibrary(files);
        }

    };


/* =========================================================
   DRAG
========================================================= */

[
    "dragenter",
    "dragover"
].forEach(
    type => {

        dropZone.addEventListener(
            type,
            event => {

                event.preventDefault();

                event.stopPropagation();

                dropZone.classList.add(
                    "dragover"
                );

            }
        );

    }
);


[
    "dragleave",
    "dragend"
].forEach(
    type => {

        dropZone.addEventListener(
            type,
            event => {

                event.preventDefault();

                event.stopPropagation();

                dropZone.classList.remove(
                    "dragover"
                );

            }
        );

    }
);


dropZone.addEventListener(
    "drop",
    async event => {

        event.preventDefault();

        event.stopPropagation();

        dropZone.classList.remove(
            "dragover"
        );


        const items =
            Array.from(
                event.dataTransfer.items || []
            );


        if(items.length){

            const files =
                await getDroppedFiles(
                    items
                );


            if(files.length){

                buildLibrary(files);

                return;

            }

        }


        const files =
            Array.from(
                event.dataTransfer.files || []
            );


        if(files.length){

            buildLibrary(files);

        }

    }
);


/* =========================================================
   DROP DIRECTORY
========================================================= */

async function getDroppedFiles(items){

    const result = [];


    for(
        const item of items
    ){

        if(
            item.kind !== "file"
        ){
            continue;
        }


        if(
            typeof item.webkitGetAsEntry ===
            "function"
        ){

            const entry =
                item.webkitGetAsEntry();


            if(!entry){
                continue;
            }


            const files =
                await readEntry(
                    entry
                );


            result.push(
                ...files
            );

        }
        else{

            const file =
                item.getAsFile();


            if(file){

                result.push(
                    file
                );

            }

        }

    }


    return result;

}


/* =========================================================
   READ ENTRY
========================================================= */

function readEntry(entry){

    return new Promise(
        resolve => {

            if(entry.isFile){

                entry.file(
                    file => {

                        try{

                            Object.defineProperty(
                                file,
                                "webkitRelativePath",
                                {
                                    value:
                                        entry.fullPath
                                            .replace(
                                                /^\//,
                                                ""
                                            ),
                                    configurable:true
                                }
                            );

                        }
                        catch(e){}


                        resolve(
                            [file]
                        );

                    },
                    () => resolve([])
                );

                return;

            }


            if(entry.isDirectory){

                const reader =
                    entry.createReader();

                const entries = [];


                function readBatch(){

                    reader.readEntries(
                        async batch => {

                            if(!batch.length){

                                const files = [];


                                for(
                                    const child
                                    of entries
                                ){

                                    const childFiles =
                                        await readEntry(
                                            child
                                        );


                                    files.push(
                                        ...childFiles
                                    );

                                }


                                resolve(
                                    files
                                );

                                return;

                            }


                            entries.push(
                                ...batch
                            );


                            readBatch();

                        },
                        () => resolve([])
                    );

                }


                readBatch();

                return;

            }


            resolve([]);

        }
    );

}


/* =========================================================
   BUILD LIBRARY
========================================================= */

async function buildLibrary(files){

    const musicFiles =
        files.filter(
            isMusic
        );


    if(!musicFiles.length){

        showMessage(
            "音楽ファイルがありません。"
        );

        return;

    }


    library = {};


    showMessage(
        `${musicFiles.length}曲のタグを読み込んでいます…`
    );


    let completed = 0;


    for(
        const file
        of musicFiles
    ){

        const metadata =
            await readMetadata(
                file
            );


        const path =
            file.webkitRelativePath ||
            file.name;


        const folder =
            getFolderInfo(
                path
            );


        /*
            M4Aタグ優先
        */

        const title =
            metadata.title ||
            removeExtension(
                file.name
            );


        const artist =
            metadata.artist ||
            folder.artist ||
            "アーティスト未分類";


        const album =
            metadata.album ||
            folder.album ||
            "アルバム未分類";


        addSong(
            artist,
            album,
            {

                name:title,

                artist:artist,

                album:album,

                albumArtist:
                    metadata.albumArtist ||
                    artist,

                genre:
                    metadata.genre ||
                    "",

                track:
                    metadata.track ||
                    0,

                disk:
                    metadata.disk ||
                    0,

                picture:
                    metadata.picture ||
                    null,

                file:file

            }
        );


        completed++;


        if(
            completed % 5 === 0 ||
            completed === musicFiles.length
        ){

            showMessage(
                `タグ読み込み中 ${completed}/${musicFiles.length}`
            );

        }

    }


    sortLibrary();

    showArtists();


    showMessage(
        `${musicFiles.length}曲を読み込みました`
    );

}


/* =========================================================
   METADATA
========================================================= */

async function readMetadata(file){

    const result = {

        title:"",
        artist:"",
        album:"",
        albumArtist:"",
        genre:"",
        track:0,
        disk:0,
        picture:null

    };


    /*
        M4A / MP4
    */

    if(
        /\.(m4a|mp4|m4b|m4p)$/i
            .test(
                file.name
            )
    ){

        try{

            const buffer =
                await file.arrayBuffer();


            const parsed =
                parseMP4Metadata(
                    buffer
                );


            Object.assign(
                result,
                parsed
            );


            return result;

        }
        catch(error){

            console.warn(
                "M4A metadata error",
                error
            );

        }

    }


    /*
        他形式については
        ファイル名を使用
    */

    return result;

}


/* =========================================================
   MP4 METADATA PARSER
========================================================= */

function parseMP4Metadata(buffer){

    const view =
        new DataView(buffer);


    const result = {

        title:"",
        artist:"",
        album:"",
        albumArtist:"",
        genre:"",
        track:0,
        disk:0,
        picture:null

    };


    const ilst =
        findAtom(
            view,
            0,
            buffer.byteLength,
            "ilst"
        );


    if(!ilst){

        return result;

    }


    const start =
        ilst.dataStart;

    const end =
        ilst.dataEnd;


    let pos =
        start;


    while(
        pos + 8 <= end
    ){

        const size =
            view.getUint32(
                pos
            );


        const type =
            readType(
                view,
                pos + 4
            );


        if(
            size < 8 ||
            pos + size > end
        ){
            break;
        }


        const atomStart =
            pos + 8;

        const atomEnd =
            pos + size;


        const dataAtom =
            findChild(
                view,
                atomStart,
                atomEnd,
                "data"
            );


        if(dataAtom){

            const payload =
                dataAtom.dataStart + 8;

            const dataEnd =
                dataAtom.dataEnd;


            const key =
                type;


            if(
                key === "©nam"
            ){

                result.title =
                    decodeMP4Text(
                        view,
                        payload,
                        dataEnd
                    );

            }

            else if(
                key === "©ART"
            ){

                result.artist =
                    decodeMP4Text(
                        view,
                        payload,
                        dataEnd
                    );

            }

            else if(
                key === "©alb"
            ){

                result.album =
                    decodeMP4Text(
                        view,
                        payload,
                        dataEnd
                    );

            }

            else if(
                key === "aART"
            ){

                result.albumArtist =
                    decodeMP4Text(
                        view,
                        payload,
                        dataEnd
                    );

            }

            else if(
                key === "©gen"
            ){

                result.genre =
                    decodeMP4Text(
                        view,
                        payload,
                        dataEnd
                    );

            }

            else if(
                key === "trkn"
            ){

                const values =
                    parseTrackData(
                        view,
                        payload,
                        dataEnd
                    );


                result.track =
                    values.track;

            }

            else if(
                key === "disk"
            ){

                const values =
                    parseTrackData(
                        view,
                        payload,
                        dataEnd
                    );


                result.disk =
                    values.track;

            }

            else if(
                key === "covr"
            ){

                const image =
                    parseCover(
                        view,
                        payload,
                        dataEnd
                    );


                if(image){

                    result.picture =
                        image;

                }

            }

        }


        pos += size;

    }


    return result;

}


/* =========================================================
   FIND ATOM
========================================================= */

function findAtom(
    view,
    start,
    end,
    wanted
){

    let pos =
        start;


    while(
        pos + 8 <= end
    ){

        let size =
            view.getUint32(
                pos
            );


        const type =
            readType(
                view,
                pos + 4
            );


        let header =
            8;


        if(size === 1){

            /*
                64bit size
            */

            if(
                pos + 16 > end
            ){
                break;
            }


            const high =
                view.getUint32(
                    pos + 8
                );

            const low =
                view.getUint32(
                    pos + 12
                );


            size =
                high * 4294967296 +
                low;


            header = 16;

        }


        if(
            size === 0
        ){

            size =
                end - pos;

        }


        if(
            size < header ||
            pos + size > end
        ){
            break;
        }


        if(
            type === wanted
        ){

            return {

                start:pos,

                size:size,

                dataStart:
                    pos + header,

                dataEnd:
                    pos + size

            };

        }


        /*
            再帰検索
        */

        const containerTypes = [
            "moov",
            "udta",
            "meta",
            "ilst",
            "----"
        ];


        if(
            containerTypes.includes(
                type
            )
        ){

            const nestedStart =
                type === "meta"
                    ? pos + header + 4
                    : pos + header;


            const nested =
                findAtom(
                    view,
                    nestedStart,
                    pos + size,
                    wanted
                );


            if(nested){
                return nested;
            }

        }


        pos += size;

    }


    return null;

}


/* =========================================================
   CHILD ATOM
========================================================= */

function findChild(
    view,
    start,
    end,
    wanted
){

    let pos =
        start;


    while(
        pos + 8 <= end
    ){

        const size =
            view.getUint32(
                pos
            );


        const type =
            readType(
                view,
                pos + 4
            );


        if(
            size < 8 ||
            pos + size > end
        ){
            break;
        }


        if(
            type === wanted
        ){

            return {

                start:pos,

                size:size,

                dataStart:
                    pos + 8,

                dataEnd:
                    pos + size

            };

        }


        pos += size;

    }


    return null;

}


/* =========================================================
   READ TYPE
========================================================= */

function readType(
    view,
    offset
){

    let result = "";


    for(
        let i = 0;
        i < 4;
        i++
    ){

        const code =
            view.getUint8(
                offset + i
            );


        if(code === 0xA9){

            result += "©";

        }
        else{

            result +=
                String.fromCharCode(
                    code
                );

        }

    }


    return result;

}


/* =========================================================
   DECODE TEXT
========================================================= */

function decodeMP4Text(
    view,
    start,
    end
){

    if(
        start >= end
    ){
        return "";
    }


    /*
        data atom:
        4 bytes type
        4 bytes locale
        ↓
        text
    */

    const bytes =
        new Uint8Array(
            view.buffer,
            start + 8,
            Math.max(
                0,
                end - start - 8
            )
        );


    /*
        UTF-8
    */

    try{

        return new TextDecoder(
            "utf-8"
        )
        .decode(
            bytes
        )
        .replace(
            /\0/g,
            ""
        )
        .trim();

    }
    catch(e){

        return "";

    }

}


/* =========================================================
   TRACK / DISK
========================================================= */

function parseTrackData(
    view,
    start,
    end
){

    if(
        start + 16 > end
    ){

        return {
            track:0,
            total:0
        };

    }


    /*
        data header 8 bytes

        reserved 2
        track number 2
        total 2
    */

    const track =
        view.getUint16(
            start + 10
        );


    const total =
        view.getUint16(
            start + 12
        );


    return {

        track:track,

        total:total

    };

}


/* =========================================================
   COVER
========================================================= */

function parseCover(
    view,
    start,
    end
){

    if(
        start + 8 > end
    ){
        return null;
    }


    const type =
        view.getUint32(
            start
        );


    /*
        13 = JPEG
        14 = PNG
    */

    let mime = "";


    if(type === 13){

        mime =
            "image/jpeg";

    }
    else if(type === 14){

        mime =
            "image/png";

    }
    else{

        return null;

    }


    const bytes =
        new Uint8Array(
            view.buffer,
            start + 8,
            end - start - 8
        );


    const blob =
        new Blob(
            [bytes],
            {
                type:mime
            }
        );


    return URL.createObjectURL(
        blob
    );

}


/* =========================================================
   FOLDER INFO
========================================================= */

function getFolderInfo(
    path
){

    const parts =
        path
            .split("/")
            .filter(Boolean);


    let artist =
        "";

    let album =
        "";


    if(parts.length >= 4){

        artist =
            parts[
                parts.length - 3
            ];

        album =
            parts[
                parts.length - 2
            ];

    }
    else if(parts.length === 3){

        artist =
            parts[0];

        album =
            parts[1];

    }
    else if(parts.length === 2){

        album =
            parts[0];

    }


    return {

        artist:
            artist,

        album:
            album

    };

}


/* =========================================================
   ADD SONG
========================================================= */

function addSong(
    artist,
    album,
    song
){

    if(!library[artist]){

        library[artist] = {};

    }


    if(!library[artist][album]){

        library[artist][album] = [];

    }


    library[artist][album]
        .push(
            song
        );

}


/* =========================================================
   SORT
========================================================= */

function sortLibrary(){

    Object.keys(
        library
    ).forEach(
        artist => {

            Object.keys(
                library[artist]
            ).forEach(
                album => {

                    library[artist][album]
                        .sort(
                            (a,b) => {

                                if(
                                    a.disk !==
                                    b.disk
                                ){

                                    return (
                                        a.disk -
                                        b.disk
                                    );

                                }


                                if(
                                    a.track &&
                                    b.track &&
                                    a.track !==
                                    b.track
                                ){

                                    return (
                                        a.track -
                                        b.track
                                    );

                                }


                                return naturalCompare(
                                    a.name,
                                    b.name
                                );

                            }
                        );

                }
            );

        }
    );

}


/* =========================================================
   ARTISTS
========================================================= */

function showArtists(){

        "hidden"
    );

    content.classList.remove(
        "hidden"
    );


    const artists =
        Object.keys(
            library
        )
        .sort(
            naturalCompare
        );

        0;


    artists.forEach(
        artist => {

            Object.keys(
                library[artist]
            ).forEach(
                album => {

                    total +=
                        library[artist][album]
                            .length;

                }

            );

        }
    );


    content.innerHTML = `

        <div class="breadcrumb">

            <span>USB</span>

            <span>›</span>

            <strong>音楽</strong>

        </div>


        <h1 class="section-title">
            アーティスト
        </h1>


        <div class="stats">
            ${artists.length}アーティスト
            ・
            ${total}曲
        </div>


        <div
            id="artistGrid"
            class="artist-grid"
        ></div>

    `;


    const grid =
        document.getElementById(
            "artistGrid"
        );


    artists.forEach(
        artist => {

            const albums =
                Object.keys(
                    library[artist]
                );


            let count =
                0;


            let artistCover =
                null;


            albums.forEach(
                album => {

                    const songs =
                        library[artist][album];


                    count +=
                        songs.length;


                    if(

                    ){

                                    song.picture
                            );

            const el =
                document.createElement(
                    "div"
                );


            el.className =

            el.innerHTML = `

                        ?
                        `<img
                            src="${artistCover}"

                        >`

                    }

                </div>


                <div class="artist-name">
                    ${escapeHTML(artist)}
                </div>


                <div class="artist-sub">
                    ${albums.length}アルバム
                    ・
                    ${count}曲
                </div>

            `;


            el.onclick =
                () =>
                    showAlbums(
                        artist
                    );


            grid.appendChild(
                el
            );

        }
    );

}


/* =========================================================
   ALBUMS
========================================================= */

){

    artistNow =

    const albums =

        )

                );

/* =========================================================
   SONGS
========================================================= */

function showSongs(
    artist,
    album
){

    artistNow =
        artist;

    albumNow =
        album;


    songsNow =
        library[artist][album];


    const firstCover =
        songsNow.find(
            song =>
                song.picture
        );


    content.innerHTML = `

        <div class="breadcrumb">

            <button
                id="backArtists"
            >
                音楽
            </button>

            <span>›</span>

            <button
                id="backAlbums"
            >
                ${escapeHTML(artist)}
            </button>

            <span>›</span>

            <strong>
                ${escapeHTML(album)}
            </strong>

        </div>


        <h1 class="section-title">
            ${escapeHTML(album)}
        </h1>


        <div class="stats">
            ${songsNow.length}曲
        </div>


        <div
            id="songList"
            class="songs"
        ></div>

    `;


    document
        .getElementById(
            "backArtists"
        )
        .onclick =
            showArtists;


    document
        .getElementById(
            "backAlbums"
        )
        .onclick =
            () =>
                showAlbums(
                    artist
                );


    const list =
        document.getElementById(
            "songList"
        );


    songsNow.forEach(
        (song,index) => {

            const el =
                document.createElement(
                    "div"
                );


            el.className =
                "song";


            el.dataset.index =
                index;


            el.innerHTML = `

                <div class="song-number">

                    ${
                        song.track ||
                        index + 1
                    }

                </div>


                <div class="song-info">

                    <div class="song-title">
                        ${escapeHTML(song.name)}
                    </div>

                    <div class="song-sub">
                        ${escapeHTML(
                            song.artist ||
                            artist
                        )}
                    </div>

                </div>


                <div class="song-icon">
                    ▶
                </div>

            `;

                () =>
                    playSong(
                        index
                    );


            list.appendChild(
                el
            );

        }
    );


    updatePlaying();

}


/* =========================================================
   PLAY
========================================================= */

function playSong(
    index
){

    if(
        index < 0 ||
        index >= songsNow.length
    ){
        return;
    }


    indexNow =
        index;


    const song =
        songsNow[index];


    if(objectURL){

        URL.revokeObjectURL(
            objectURL
        );

    }


    objectURL =
        URL.createObjectURL(
            song.file
        );


    audio.src =
        objectURL;


    currentTitle.textContent =
        song.name;


    currentArtist.textContent =
        song.artist +
        " • " +
        song.album;


    if(song.picture){

        cover.innerHTML = `

            <img
                src="${song.picture}"
                alt=""
            >

        `;

    }
    else{

        cover.textContent =
            "🎵";

    }


    audio.load();


    audio.play()
        .then(
            () => {

                playButton.textContent =
                    "⏸";

            }
        )
        .catch(
            () => {

                playButton.textContent =
                    "▶";

                showMessage(
                    "この音声形式をSafariで再生できませんでした。"
                );

            }
        );


    updatePlaying();

}


/* =========================================================
   PLAY PAUSE
========================================================= */

playButton.onclick =
    () => {

        if(!audio.src){

            if(songsNow.length){

                playSong(0);

            }

            return;

        }


        if(audio.paused){

            audio.play();

            playButton.textContent =
                "⏸";

        }
        else{

            audio.pause();

            playButton.textContent =
                "▶";

        }

    };


/* =========================================================
   PREV
========================================================= */

prevButton.onclick =
    () => {

        if(!songsNow.length){
            return;
        }


        let i =
            indexNow - 1;


        if(i < 0){

            i =
                songsNow.length - 1;

        }


        playSong(i);

    };


/* =========================================================
   NEXT
========================================================= */

nextButton.onclick =
    () => {

        if(!songsNow.length){
            return;
        }


        let i =
            indexNow + 1;


        if(
            i >= songsNow.length
        ){

            i = 0;

        }


        playSong(i);

    };


/* =========================================================
   AUTO NEXT
========================================================= */

audio.onended =
    () => {

        if(!songsNow.length){
            return;
        }


        let i =
            indexNow + 1;


        if(
            i >= songsNow.length
        ){

            i = 0;

        }


        playSong(i);

    };


/* =========================================================
   TIME
========================================================= */

audio.ontimeupdate =
    () => {

        if(
            !isFinite(
                audio.duration
            )
        ){
            return;
        }


        progress.value =
            audio.currentTime /
            audio.duration *
            100;


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    };


audio.onloadedmetadata =
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    };


/* =========================================================
   SEEK
========================================================= */

progress.oninput =
    () => {

        if(
            !isFinite(
                audio.duration
            )
        ){
            return;
        }


        audio.currentTime =
            progress.value /
            100 *
            audio.duration;

    };


/* =========================================================
   PLAYING
========================================================= */

function updatePlaying(){

    document
        .querySelectorAll(
            ".song"
        )
        .forEach(
            el =>
                el.classList.remove(
                    "playing"
                )
        );


    const current =
        document.querySelector(
            `.song[data-index="${indexNow}"]`
        );


    if(current){

        current.classList.add(
            "playing"
        );

    }

}


/* =========================================================
   MUSIC
========================================================= */

function isMusic(
    file
){

    if(
        file.type &&
        file.type.startsWith(
            "audio/"
        )
    ){

        return true;

    }


    return /\.(m4a|mp4|m4b|m4p|mp3|aac|wav|ogg|oga|flac|aiff)$/i
        .test(
            file.name
        );

}


/* =========================================================
   EXTENSION
========================================================= */

function removeExtension(
    name
){

    return name.replace(
        /\.(m4a|mp4|m4b|m4p|mp3|aac|wav|ogg|oga|flac|aiff)$/i,
        ""
    );

}


/* =========================================================
   SORT
========================================================= */

function naturalCompare(
    a,
    b
){

    return a.localeCompare(
        b,
        undefined,
        {
            numeric:true,
            sensitivity:"base"
        }
    );

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
    seconds
){

    if(
        !isFinite(seconds)
    ){

        return "0:00";

    }


    const min =
        Math.floor(
            seconds / 60
        );


    const sec =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    return (
        min +
        ":" +
        sec
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
    text
){

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text
){

    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            3500
        );

}
