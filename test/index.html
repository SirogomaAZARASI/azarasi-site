<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>POLYTYPE</title>

<meta name="description" content="Typing × Polygon Evolution">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>
<body>

<div id="bootScreen">

    <div class="bootLogo">
        POLYTYPE
    </div>

    <div class="bootSub">
        POLYGON EVOLUTION SYSTEM
    </div>

    <button id="startBtn">
        START
    </button>

</div>

<div id="gameContainer" class="hidden">

    <header id="topBar">

        <div class="logoArea">

            <div class="logo">
                POLYTYPE
            </div>

            <div class="version">
                BUILD 1.0
            </div>

        </div>

        <div class="statsArea">

            <div class="statBox">
                <span class="statLabel">LV</span>
                <span id="level">1</span>
            </div>

            <div class="statBox">
                <span class="statLabel">XP</span>
                <span id="xp">0</span>
            </div>

            <div class="statBox">
                <span class="statLabel">TYPE</span>
                <span id="typedCount">0</span>
            </div>

            <div class="statBox">
                <span class="statLabel">SCORE</span>
                <span id="score">0</span>
            </div>

            <div class="statBox">
                <span class="statLabel">TIME</span>
                <span id="timer">60</span>
            </div>

        </div>

    </header>

    <main id="mainLayout">

        <section id="viewerPanel">

            <canvas id="threeCanvas"></canvas>

            <div id="shapeInfo">

                <div id="shapeName">
                    POINT
                </div>

                <div id="shapeJP">
                    点
                </div>

                <div id="shapeRarity">
                    N
                </div>

            </div>

            <div id="viewerControls">

                <button id="prevShape">
                    ◀
                </button>

                <button id="nextShape">
                    ▶
                </button>

            </div>

        </section>

        <section id="typingPanel">

            <div class="panelTitle">
                INPUT SEQUENCE
            </div>

            <div id="questionType">
                WORD
            </div>

            <div id="jpText">
                こんにちは
            </div>

            <div id="romaText">
                konnichiwa
            </div>

            <div id="typedText">
            </div>

            <div id="comboArea">
                COMBO
                <span id="combo">
                    0
                </span>
            </div>

            <div id="progressArea">

                <div id="progressBar">
                    <div id="progressFill"></div>
                </div>

            </div>

        </section>

        <aside id="databasePanel">

            <div class="panelTitle">
                DATABASE
            </div>

            <div id="shapeList">
            </div>

        </aside>

    </main>

    <footer id="bottomBar">

        <div id="achievementArea">
            READY
        </div>

    </footer>

</div>

<div id="unlockPopup" class="popup hidden">

    <div class="popupTitle">
        NEW POLYHEDRON
    </div>

    <div id="unlockShapeName">
        CUBE
    </div>

</div>

<div id="achievementPopup" class="popup hidden">

    <div class="popupTitle">
        ACHIEVEMENT
    </div>

    <div id="achievementName">
        FIRST TYPE
    </div>

</div>

<div id="levelupPopup" class="popup hidden">

    <div class="popupTitle">
        LEVEL UP
    </div>

    <div id="levelupValue">
        LV 2
    </div>

</div>

<div id="xpBar">

    <div id="xpFill"></div>

</div>

<div id="scanlines"></div>

<div id="particles"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script>

<script src="words.js"></script>
<script src="shapes.js"></script>
<script src="game.js"></script>

</body>
</html>
