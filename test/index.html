<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ITA Corpus Viewer</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
max-width:900px;
margin:auto;
padding:20px;
text-align:center;
line-height:1.8;
}

.progress{
width:100%;
height:14px;
background:#e5e7eb;
border-radius:999px;
overflow:hidden;
margin-bottom:10px;
}

.progress-bar{
height:100%;
width:0%;
background:#2563eb;
transition:.2s;
}

.progress-text{
font-size:20px;
font-weight:bold;
margin-bottom:40px;
}

.number{
font-size:18px;
color:#666;
margin-bottom:20px;
}

.text{
font-size:clamp(2rem,5vw,3.5rem);
font-weight:700;
margin-bottom:15px;
}

.ruby{
font-size:clamp(1.2rem,3vw,1.8rem);
color:#666;
margin-bottom:50px;
}

.controls{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

button{
border:none;
background:#2563eb;
color:white;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.jump{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

input{
padding:10px;
width:100px;
text-align:center;
font-size:16px;
}
</style>
</head>
<body>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="progress-text" id="progressText">
0 / 0
</div>

<div class="number" id="number">
No.000
</div>

<div class="text" id="text">
読み込み中...
</div>

<div class="ruby" id="ruby">
読み込み中...
</div>

<div class="controls">
<button id="prevBtn">← 前へ</button>
<button id="nextBtn">次へ →</button>
</div>

<div class="jump">
<input
type="number"
id="jumpInput"
min="1"
placeholder="番号">

<button id="jumpBtn">
移動
</button>
</div>

<script>

let corpus = [];

let current = 0;

async function loadCorpus(){

const response =
await fetch("corpus.json");

corpus =
await response.json();

current =
parseInt(
localStorage.getItem("itaIndex")
) || 0;

if(current >= corpus.length){
current = 0;
}

update();

}

function update(){

const item =
corpus[current];

document.getElementById("number")
.textContent =
`No.${String(item.id).padStart(3,"0")}`;

document.getElementById("text")
.textContent =
item.text;

document.getElementById("ruby")
.textContent =
item.ruby;

const percent =
((current + 1) /
corpus.length) * 100;

document.getElementById("progressBar")
.style.width =
percent + "%";

document.getElementById("progressText")
.textContent =
`${current + 1} / ${corpus.length}`;

localStorage.setItem(
"itaIndex",
current
);

}

document
.getElementById("nextBtn")
.addEventListener("click",()=>{

if(current < corpus.length - 1){

current++;

update();

}

});

document
.getElementById("prevBtn")
.addEventListener("click",()=>{

if(current > 0){

current--;

update();

}

});

document
.getElementById("jumpBtn")
.addEventListener("click",()=>{

const value =
parseInt(
document.getElementById(
"jumpInput"
).value
);

const index =
corpus.findIndex(
item => item.id === value
);

if(index !== -1){

current = index;

update();

}

});

loadCorpus();

</script>

</body>
</html>
